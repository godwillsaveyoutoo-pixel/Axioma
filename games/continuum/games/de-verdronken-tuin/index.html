function pick(x,y){const L=layout(),d=q=>Math.hypot(x-q.x,y-q.y);if(d(L.plus)<Math.max(46,L.plus.r*1.4))return'plus';if(d(L.minus)<Math.max(46,L.minus.r*1.4))return'minus';const c=controls(L);if(d(c.turn)<c.turn.r)return'turn';if(d(c.fold)<c.fold.r)return'fold';return null}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
canvas.addEventListener('pointerdown',e=>{const p=pointer(e),a=pick(p.x,p.y);down=a;if(!a||anim.water)return;AUDIO.cue('grab',.46);canvas.style.cursor=(a==='turn'||a==='fold')?'grabbing':'pointer';canvas.setPointerCapture(e.pointerId);if((a==='turn'||a==='fold')&&!anim.machine){const L=layout(),from=state.pav,to=nextPav(a,from),p0=controlPoint(L,from,a),p1=controlPoint(L,to,a);let vx=p1.x-p0.x,vy=p1.y-p0.y;if(Math.hypot(vx,vy)<14*L.s){vx=a==='turn'?0:42*L.s;vy=a==='turn'?48*L.s:0}drag={kind:a,from,to,support:support(),rooted:!!state.plant,start:p,vx,vy,progress:0,max:0}}});
canvas.addEventListener('pointermove',e=>{const p=pointer(e);if(drag){const dx=p.x-drag.start.x,dy=p.y-drag.start.y,den=drag.vx**2+drag.vy**2||1;drag.progress=clamp((dx*drag.vx+dy*drag.vy)/den,0,1.06);drag.max=Math.max(drag.max,drag.progress);hover=drag.kind}else hover=pick(p.x,p.y);canvas.style.cursor=hover?'pointer':'default'});
canvas.addEventListener('pointerup',e=>{const p=pointer(e),a=down;down=null;canvas.style.cursor='default';if(drag){const d=drag;drag=null;if(d.max>=.44)machineTransition(d.kind,d.from,d.to,d.progress);else say('De vleugel veert terug. Trek iets verder om haar mee te nemen.');hover=pick(p.x,p.y);return}const up=pick(p.x,p.y);if(a===up&&(a==='plus'||a==='minus'))actionWater(a)});
canvas.addEventListener('pointercancel',()=>{down=null;drag=null;canvas.style.cursor='default'});canvas.addEventListener('pointerleave',()=>{if(!drag){hover=null;canvas.style.cursor='default'}});
function say(t){whisperEl.textContent=t;whisperEl.classList.add('show');clearTimeout(whisperTimer);whisperTimer=setTimeout(()=>whisperEl.classList.remove('show'),2300)}
function updateDebug(){if(debugMode)debugState.textContent=`water=${state.water.join('/')}  pav=${state.pav}  plant=${state.plant}  fish=${state.fish}  moves=${state.moves}  fx=${LOW_POWER?'low':'full'} dpr=${dpr.toFixed(1)}`}
function reset(){state=copy(initial);hover=down=drag=null;anim={water:null,fish:null,machine:null,plant:0,ripples:[]};endingEl.hidden=true;say('Kijk wat het water draagt — en wat het licht bereikt.');updateDebug()}
document.querySelector('#reset').addEventListener('click',reset);document.querySelector('#again').addEventListener('click',reset);
function loop(t){now=t;draw();requestAnimationFrame(loop)}updateDebug();say('Raak de wereld aan. Dezelfde ingreep kan later iets anders betekenen.');requestAnimationFrame(loop);
})();
</script>
