<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Getallenfrontier v1.4 — Belgian Math Truth</title>
<style>
  :root{
    --bg:#07111f;
    --bg2:#0b1a2c;
    --ink:#eef7ff;
    --muted:#9fb2c7;
    --line:#23415e;
    --accent:#7de0c3;
    --accent2:#ffd56a;
    --danger:#ff8d86;
    --ok:#8ee49a;
    --glass:rgba(255,255,255,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  button{font:inherit}
  #app{
    width:100vw;height:100dvh;
    display:grid;grid-template-rows:auto 1fr auto;
    background:
      radial-gradient(circle at 20% 10%, rgba(125,224,195,.08), transparent 34%),
      radial-gradient(circle at 80% 85%, rgba(255,213,106,.08), transparent 28%),
      linear-gradient(180deg,var(--bg2),var(--bg));
  }
  header{
    min-height:58px;
    display:flex;align-items:center;gap:10px;
    padding:max(8px,env(safe-area-inset-top)) 14px 8px;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(7,17,31,.86);backdrop-filter:blur(10px);
  }
  .brand{
    border:0;background:transparent;color:var(--ink);font-weight:800;
    display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;cursor:pointer;
    font-size:clamp(15px,2.4vw,22px);
  }
  .brand:hover{background:var(--glass)}
  .logo{
    width:24px;height:24px;border:2px solid var(--accent);border-radius:50%;
    position:relative;flex:0 0 auto;
  }
  .logo:before,.logo:after{
    content:"";position:absolute;left:50%;top:50%;background:var(--accent);transform:translate(-50%,-50%)
  }
  .logo:before{width:13px;height:2px}.logo:after{width:2px;height:13px}
  .spacer{flex:1}
  .topbtn{
    min-width:48px;min-height:42px;border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer;
  }
  .topbtn:hover{background:rgba(255,255,255,.09)}
  #progressText{font-size:clamp(13px,2vw,18px);color:var(--muted);font-weight:700;white-space:nowrap}
  main{min-height:0;position:relative;overflow:hidden}
  .screen{
    position:absolute;inset:0;
    padding:clamp(12px,2vw,22px);
    display:none;
    overflow:auto;
  }
  .screen.active{display:flex}
  #homeScreen{
    align-items:center;justify-content:center;
  }
  .homeWrap{
    width:min(1100px,96vw);
    display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;
  }
  .hero h1{font-size:clamp(34px,6vw,76px);line-height:.95;margin:0 0 14px;letter-spacing:-.04em}
  .hero p{font-size:clamp(16px,2.2vw,24px);line-height:1.4;color:var(--muted);max-width:720px;margin:0 0 22px}
  .ctaRow{display:flex;gap:12px;flex-wrap:wrap}
  .primary,.secondary,.choice{
    border:0;border-radius:14px;min-height:52px;padding:12px 18px;cursor:pointer;font-weight:800;
  }
  .primary{background:var(--accent);color:#062019}
  .secondary{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.11)}
  .heroPanel{
    min-height:320px;border:1px solid rgba(255,255,255,.1);border-radius:28px;
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01));
  }
  .heroAxis{
    width:86%;height:4px;background:#7890a9;position:relative;border-radius:3px;
  }
  .heroAxis:before,.heroAxis:after{
    content:"";position:absolute;top:-11px;width:2px;height:26px;background:#cbd8e5
  }
  .heroAxis:before{left:18%}.heroAxis:after{right:18%}
  .heroSignal{
    position:absolute;left:58%;top:36%;
    width:36px;height:36px;border-radius:50%;
    border:2px solid var(--accent2);
    box-shadow:0 0 0 8px rgba(255,213,106,.08),0 0 30px rgba(255,213,106,.35);
  }
  .homeStats{margin-top:16px;color:var(--muted);font-size:14px}

  #menuScreen{align-items:flex-start;justify-content:center}
  .menuWrap{width:min(1180px,100%);margin:auto}
  .menuTitle{display:flex;align-items:end;gap:14px;margin-bottom:14px}
  .menuTitle h2{font-size:clamp(26px,4vw,46px);margin:0}
  .menuTitle p{margin:0 0 4px;color:var(--muted)}
  .levelGrid{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
  }
  .levelCard{
    text-align:left;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);
    color:var(--ink);border-radius:16px;padding:14px;min-height:112px;cursor:pointer;
  }
  .levelCard:hover{background:rgba(255,255,255,.08)}
  .levelCard.locked{opacity:.42;cursor:not-allowed}
  .levelCard.done{border-color:rgba(142,228,154,.45)}
  .levelNo{font-weight:900;color:var(--accent2);font-size:13px}
  .levelName{font-weight:800;font-size:18px;margin:4px 0}
  .levelKind{color:var(--muted);font-size:13px}

  #gameScreen{
    overflow:hidden;
    display:none;
    flex-direction:column;
    align-items:stretch;
    justify-content:stretch;
  }
  #gameScreen.active{display:flex}
  .missionHead{
    display:flex;align-items:flex-start;gap:14px;
    max-width:1200px;width:100%;margin:0 auto 8px;
  }
  .missionKicker{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:900}
  .missionTitle{font-size:clamp(24px,4.2vw,50px);line-height:1.02;margin:2px 0 5px}
  .missionText{color:var(--muted);font-size:clamp(15px,2vw,20px);margin:0;max-width:900px}
  #gameArea{
    flex:1;min-height:0;
    width:100%;max-width:1200px;margin:0 auto;
    display:flex;align-items:center;justify-content:center;
    position:relative;
  }
  .stage{
    width:100%;height:100%;
    min-height:260px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:24px;
    background:rgba(255,255,255,.025);
    position:relative;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .axisWrap{
    width:min(1000px,92%);position:relative;padding-top:90px;padding-bottom:88px;
  }
  .targetReadout{
    position:absolute;left:50%;top:0;transform:translateX(-50%);
    min-width:180px;text-align:center;
  }
  .targetExpr{
    font-size:clamp(34px,7vw,74px);font-weight:900;letter-spacing:-.03em;
  }
  .hintSmall{font-size:13px;color:var(--muted);margin-top:2px}
  .axis{
    position:relative;height:5px;background:#8ba0b7;border-radius:999px;
    margin:28px 34px;
  }
  .tick{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    width:2px;height:30px;background:#dce8f3;
  }
  .tickLabel{
    position:absolute;top:20px;left:50%;transform:translateX(-50%);
    color:#c7d4e2;font-size:clamp(13px,2vw,18px);white-space:nowrap;font-weight:700;
  }
  .pointHit{
    position:absolute;top:-34px;transform:translateX(-50%);
    width:68px;height:72px;border:0;background:transparent;cursor:pointer;
    border-radius:14px;
  }
  .pointHit:hover{background:rgba(255,255,255,.05)}
  .marker{
    position:absolute;top:50%;transform:translate(-50%,-50%);
    width:28px;height:28px;border-radius:50%;
    border:3px solid var(--accent2);background:var(--bg2);
    box-shadow:0 0 0 8px rgba(255,213,106,.08);
    pointer-events:none;
  }
  .intervalSeg{
    position:absolute;top:-26px;height:56px;border-radius:14px;
    background:rgba(125,224,195,.08);border:1px solid rgba(125,224,195,.22);
    cursor:pointer;
  }
  .intervalSeg:hover{background:rgba(125,224,195,.14)}
  .intervalSeg.selected{background:rgba(125,224,195,.28);border-color:var(--accent)}
  .numberLineLegend{
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:56px;color:var(--muted)
  }

  .shapeStage{width:100%;height:100%;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;align-items:center}
  .shapeVisual{
    display:flex;align-items:center;justify-content:center;min-height:220px;
  }
  .square{
    width:min(36vw,230px);aspect-ratio:1;border:4px solid var(--accent);display:grid;place-items:center;
    background:rgba(125,224,195,.06);box-shadow:0 0 50px rgba(125,224,195,.08) inset;
  }
  .cube{
    width:min(30vw,190px);aspect-ratio:1;border:4px solid var(--accent2);display:grid;place-items:center;
    background:rgba(255,213,106,.06);transform:skewY(-5deg) rotate(3deg);
  }
  .shapeArea{font-size:clamp(30px,5vw,60px);font-weight:900}
  .shapeSide{font-size:clamp(16px,2.2vw,22px);color:var(--muted);margin-top:8px;text-align:center}
  .answerPanel{display:flex;flex-direction:column;gap:10px;align-items:stretch;justify-content:center}
  .answerPanel .choice{
    background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.1);
    font-size:clamp(16px,2.2vw,22px);
  }
  .answerPanel .choice:hover{background:rgba(255,255,255,.12)}
  .answerPanel .choice.selected{outline:2px solid var(--accent)}

  .scannerStage{
    width:100%;height:100%;display:grid;grid-template-columns:1fr minmax(180px,.55fr) 1fr;gap:14px;padding:22px;align-items:center
  }
  .scannerItem{
    display:grid;place-items:center;min-height:160px;
    font-size:clamp(38px,8vw,88px);font-weight:900;
  }
  .gate{
    min-height:210px;border:3px solid var(--accent);border-radius:26px;display:grid;place-items:center;text-align:center;
    background:rgba(125,224,195,.05);padding:18px;
  }
  .gateTitle{font-size:clamp(24px,4vw,42px);font-weight:900}
  .gateSub{color:var(--muted);font-size:14px;margin-top:8px}
  .decisionCol{display:flex;flex-direction:column;gap:10px}
  .accept{background:var(--accent);color:#062019}
  .reject{background:rgba(255,141,134,.14);color:#ffd6d2;border:1px solid rgba(255,141,134,.35)}
  .decisionCol button{min-height:58px;border-radius:14px;font-weight:900;font-size:18px;cursor:pointer}
  .queueProgress{color:var(--muted);font-size:14px;text-align:center;margin-top:8px}

  .translateStage{width:100%;height:100%;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;padding:22px;align-items:center}
  .bigToken{
    min-height:190px;border:1px solid rgba(255,255,255,.12);border-radius:24px;
    display:grid;place-items:center;font-size:clamp(38px,7vw,78px);font-weight:900;background:rgba(255,255,255,.04)
  }
  .equals{font-size:clamp(28px,5vw,54px);font-weight:900;color:var(--accent2)}
  .optionStack{display:flex;flex-direction:column;gap:10px}
  .optionStack .choice{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid rgba(255,255,255,.1);font-size:clamp(18px,2.5vw,26px)}
  .optionStack .choice:hover{background:rgba(255,255,255,.12)}

  .footer{
    min-height:70px;padding:8px 14px max(8px,env(safe-area-inset-bottom));
    border-top:1px solid rgba(255,255,255,.07);
    background:rgba(7,17,31,.9);backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:10px;
  }
  .instruction{flex:1;font-weight:800;font-size:clamp(14px,2.2vw,20px);min-width:0}
  .feedback{color:var(--muted);font-size:13px;font-weight:700}
  .footer button{
    min-height:50px;padding:10px 18px;border-radius:13px;border:0;font-weight:900;cursor:pointer;
  }
  #testBtn{background:var(--accent2);color:#2a1d00}
  #nextBtn{background:var(--ok);color:#0c2a12;display:none}
  #retryBtn{background:rgba(255,255,255,.08);color:var(--ink);display:none;border:1px solid rgba(255,255,255,.1)}
  #testBtn:disabled{opacity:.35;cursor:not-allowed}
  #toast{
    position:absolute;left:50%;top:16px;transform:translateX(-50%) translateY(-10px);
    padding:10px 14px;border-radius:999px;background:#102538;border:1px solid rgba(255,255,255,.12);
    color:var(--ink);font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:20;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{border-color:rgba(142,228,154,.55)}
  #toast.bad{border-color:rgba(255,141,134,.55)}

  @media (max-width:800px){
    .homeWrap{grid-template-columns:1fr}
    .heroPanel{min-height:190px}
    .levelGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
    .shapeStage{grid-template-columns:1fr 1fr;gap:10px;padding:12px}
    .scannerStage{grid-template-columns:1fr 150px 1fr;padding:12px}
    .gate{min-height:160px}
  }
  @media (max-width:640px) and (orientation:portrait){
    .levelGrid{grid-template-columns:1fr}
    .heroPanel{display:none}
    .homeWrap{width:min(560px,95vw)}
    .missionHead{margin-bottom:2px}
    .shapeStage{grid-template-columns:1fr;overflow:auto}
    .shapeVisual{min-height:160px}
    .scannerStage{grid-template-columns:1fr;overflow:auto}
    .scannerItem{min-height:110px}
    .gate{min-height:120px}
    .decisionCol{flex-direction:row}
    .decisionCol button{flex:1}
    .translateStage{grid-template-columns:1fr;overflow:auto}
    .equals{display:none}
    .bigToken{min-height:120px}
  }
  @media (max-height:460px) and (orientation:landscape){
    header{min-height:48px;padding-top:5px;padding-bottom:5px}
    .missionTitle{font-size:28px}
    .missionText{font-size:14px}
    .missionHead{margin-bottom:4px}
    .stage{min-height:220px}
    .axisWrap{padding-top:62px;padding-bottom:48px}
    .targetExpr{font-size:44px}
    .numberLineLegend{margin-top:42px;font-size:12px}
    .footer{min-height:58px;padding-top:5px;padding-bottom:5px}
    .footer button{min-height:44px}
    .shapeStage,.scannerStage,.translateStage{padding:10px}
    .square{width:145px}
    .cube{width:130px}
    .shapeVisual{min-height:150px}
    .scannerItem{min-height:130px}
    .gate{min-height:145px}
    .bigToken{min-height:135px}
  }

  /* v0.2a — leerflow: uitleg → oefenen → transfer */
  .chapterList{display:flex;flex-direction:column;gap:14px}
  .chapterBlock{
    border:1px solid rgba(255,255,255,.10);
    border-radius:20px;
    background:rgba(255,255,255,.03);
    overflow:hidden;
  }
  .chapterHead{
    display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;
    padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.07)
  }
  .chapterNo{
    width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    background:rgba(125,224,195,.10);border:1px solid rgba(125,224,195,.28);
    color:var(--accent);font-weight:900
  }
  .chapterHead h3{margin:0;font-size:clamp(18px,2.4vw,25px)}
  .chapterMeta{color:var(--muted);font-size:13px;margin-top:2px}
  .lessonBtn{
    min-height:44px;border-radius:12px;padding:8px 13px;border:1px solid rgba(255,213,106,.32);
    background:rgba(255,213,106,.09);color:var(--accent2);font-weight:900;cursor:pointer
  }
  .lessonBtn:disabled{opacity:.35;cursor:not-allowed}
  .chapterMissions{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px
  }
  .chapterMissions .levelCard{min-height:94px;padding:11px}
  .transferTag{
    display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 7px;border-radius:999px;
    background:rgba(255,213,106,.10);color:var(--accent2);font-size:11px;font-weight:900
  }

  .lessonStage{
    width:100%;height:100%;min-height:270px;display:grid;grid-template-columns:minmax(250px,.9fr) minmax(340px,1.1fr);
    align-items:center;gap:clamp(14px,3vw,34px);padding:clamp(14px,3vw,34px)
  }
  .lessonCopy{max-width:520px}
  .lessonEyebrow{color:var(--accent);font-size:12px;letter-spacing:.13em;font-weight:900;text-transform:uppercase}
  .lessonBig{font-size:clamp(28px,4.6vw,54px);line-height:1.02;font-weight:900;margin:7px 0 12px;letter-spacing:-.03em}
  .lessonRule{font-size:clamp(16px,2vw,21px);line-height:1.45;color:#c8d7e5}
  .lessonRule strong{color:var(--ink)}
  .lessonHint{margin-top:12px;color:var(--muted);font-size:13px}
  .lessonVisual{
    min-height:250px;position:relative;border-radius:24px;
    border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.025);
    overflow:hidden;display:grid;place-items:center
  }
  .replayLesson{
    position:absolute;right:10px;top:10px;z-index:5;border:1px solid rgba(255,255,255,.12);
    background:rgba(7,17,31,.72);color:var(--ink);border-radius:10px;min-height:38px;padding:7px 10px;cursor:pointer
  }

  /* demo 1: one value, different codes */
  .demoAxis{position:absolute;left:8%;right:8%;top:58%;height:4px;border-radius:99px;background:#7890a9}
  .demoAxis:before,.demoAxis:after{content:"";position:absolute;top:-10px;width:2px;height:24px;background:#dce8f3}
  .demoAxis:before{left:25%}.demoAxis:after{left:75%}
  .demoPoint{
    position:absolute;left:50%;top:58%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);
    border:3px solid var(--accent2);background:var(--bg2);
    box-shadow:0 0 0 9px rgba(255,213,106,.08),0 0 26px rgba(255,213,106,.22)
  }
  .demoMorph{position:absolute;top:22%;left:50%;transform:translateX(-50%);font-size:clamp(28px,5vw,54px);font-weight:900}
  .lessonVisual.play .demoMorph{animation:morphCodes 6s steps(1,end) infinite}
  @keyframes morphCodes{
    0%,24%{font-size:0}
    0%,24%{--x:0}
  }
  .demoMorph:after{content:"1/2"}
  .lessonVisual.play .demoMorph:after{animation:codeText 6s steps(1,end) infinite}
  @keyframes codeText{0%,32%{content:"1/2"}33%,65%{content:"0,5"}66%,100%{content:"50 %"}}

  /* demo 2: decimal streams */
  .decimalDemo{display:grid;gap:14px;width:82%;font-weight:900}
  .decimalRow{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center}
  .decimalLabel{font-size:13px;color:var(--muted)}
  .digitTrack{font-size:clamp(20px,3.2vw,35px);white-space:nowrap;overflow:hidden;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04)}
  .periodic{letter-spacing:.08em}
  .lessonVisual.play .periodic span{animation:pulsePeriod 1.05s ease-in-out infinite}
  @keyframes pulsePeriod{50%{color:var(--accent2);text-shadow:0 0 16px rgba(255,213,106,.45)}}
  .nonperiodic{position:relative}
  .lessonVisual.play .nonperiodic{animation:driftDigits 4s linear infinite}
  @keyframes driftDigits{0%{letter-spacing:.00em}50%{letter-spacing:.07em}100%{letter-spacing:.00em}}

  /* demo 3: square-root emergence */
  .rootDemo{position:relative;width:82%;height:82%;display:grid;place-items:center}
  .growingSquare{
    width:128px;height:128px;border:4px solid var(--accent);background:rgba(125,224,195,.07);
    display:grid;place-items:center;font-size:30px;font-weight:900
  }
  .lessonVisual.play .growingSquare{animation:squareBreathe 5s ease-in-out infinite}
  @keyframes squareBreathe{0%,20%{width:120px;height:120px}45%{width:145px;height:145px}70%,100%{width:132px;height:132px}}
  .rootBracket{position:absolute;bottom:18px;left:10%;right:10%;display:flex;justify-content:space-between;color:var(--muted);font-weight:800}
  .rootSignal{position:absolute;bottom:17px;left:50%;transform:translateX(-50%);color:var(--accent2);font-size:23px;font-weight:900}

  /* demo 4: nested number sets */
  .setNest{position:relative;width:92%;height:92%;display:grid;place-items:center}
  .setRing{position:absolute;border:2px solid;border-radius:50%;display:flex;align-items:flex-start;justify-content:center;font-weight:900;padding-top:8px}
  .setR{width:92%;height:88%;border-color:#6e92b4;color:#bcd0e3}
  .setQ{width:70%;height:68%;border-color:var(--accent);color:var(--accent)}
  .setZ{width:48%;height:48%;border-color:var(--accent2);color:var(--accent2)}
  .setN{width:26%;height:28%;border-color:#f5a6ff;color:#f5a6ff}
  .setIrr{position:absolute;right:12%;top:35%;color:#d7e5f2;font-size:15px;font-weight:800}
  .lessonVisual.play .setRing{animation:setPulse 4s ease-in-out infinite}
  .lessonVisual.play .setQ{animation-delay:.35s}.lessonVisual.play .setZ{animation-delay:.7s}.lessonVisual.play .setN{animation-delay:1.05s}
  @keyframes setPulse{50%{filter:drop-shadow(0 0 8px currentColor);transform:scale(1.015)}}

  /* demo 5: interval endpoints */
  .intervalDemo{width:86%;position:relative;height:120px}
  .intervalLine{position:absolute;left:5%;right:5%;top:55%;height:5px;background:#7c94ab;border-radius:99px}
  .intervalGlow{position:absolute;left:27%;width:46%;top:calc(55% - 12px);height:29px;border-radius:99px;background:rgba(125,224,195,.25)}
  .endDot{position:absolute;top:calc(55% - 10px);width:25px;height:25px;border-radius:50%;border:3px solid var(--accent);background:var(--bg2)}
  .endDot.left{left:27%;transform:translateX(-50%)}.endDot.right{left:73%;transform:translateX(-50%)}
  .endDot.filled{background:var(--accent)}
  .endLabel{position:absolute;top:76%;color:var(--ink);font-weight:900}
  .endLabel.l{left:27%;transform:translateX(-50%)}.endLabel.r{left:73%;transform:translateX(-50%)}
  .intervalSymbol{position:absolute;top:8%;left:50%;transform:translateX(-50%);font-size:clamp(28px,4vw,44px);font-weight:900}
  .lessonVisual.play .intervalGlow{animation:intervalPulse 2.2s ease-in-out infinite}
  @keyframes intervalPulse{50%{box-shadow:0 0 28px rgba(125,224,195,.25)}}

  /* demo 6: rounding */
  .roundDemo{width:86%;position:relative;height:150px}
  .roundLine{position:absolute;left:7%;right:7%;top:62%;height:5px;background:#7d93a9}
  .roundTick{position:absolute;top:calc(62% - 10px);height:25px;width:2px;background:#e1ebf5}
  .roundTick.a{left:22%}.roundTick.b{left:50%}.roundTick.c{left:78%}
  .roundLbl{position:absolute;top:75%;transform:translateX(-50%);color:var(--muted);font-weight:800}
  .roundLbl.a{left:22%}.roundLbl.b{left:50%}.roundLbl.c{left:78%}
  .roundMarker{position:absolute;left:37%;top:calc(62% - 11px);width:26px;height:26px;border-radius:50%;background:var(--accent2);transform:translateX(-50%)}
  .lessonVisual.play .roundMarker{animation:roundSnap 4s ease-in-out infinite}
  @keyframes roundSnap{0%,35%{left:37%}65%,100%{left:22%}}
  .roundExpr{position:absolute;top:12%;left:50%;transform:translateX(-50%);font-size:31px;font-weight:900}

  /* demo 7: root properties */
  .propertyDemo{display:grid;gap:16px;place-items:center;text-align:center}
  .propertyBlocks{display:flex;align-items:center;gap:8px}

  .prop9{width:105px;height:105px}.prop4{width:70px;height:70px;border-color:var(--accent2)}
  .propertyEq{font-size:clamp(21px,3vw,36px);font-weight:900}
  .lessonVisual.play .propBlock{animation:propNudge 3s ease-in-out infinite}
  @keyframes propNudge{50%{transform:translateY(-5px)}}

  /* demo 8: cube roots */
  .cubeDemo{display:grid;place-items:center;gap:20px}
  .demoCube{width:125px;height:125px;border:4px solid var(--accent2);background:rgba(255,213,106,.07);display:grid;place-items:center;font-size:27px;font-weight:900;transform:skewY(-5deg) rotate(3deg)}

  /* =========================================================
     v0.3 — PRO STYLE PASS
     Researched from Apple HIG + NN/g:

     progressive disclosure, high contrast, no card-within-card.
     ========================================================= */

  :root{

    --signal:#ffd60a;

    --success:#30d158;
    --danger:#ff453a;

    --radius-xl:22px;
    --radius-lg:16px;
    --radius-md:12px;
    --page-x:clamp(16px,3vw,32px);

  html{color-scheme:dark}

  body{

  }

  .brand:hover{background:transparent}
  .brand:active{opacity:.62}

  .logo{
    width:24px;height:24px;
    border-width:2px;
    border-color:var(--accent);
  }
  .logo:before,.logo:after{background:var(--accent)}

  .toolbar{
    display:flex;
    align-items:center;
    gap:2px;
  }

  .topbtn{
    min-width:44px;
    min-height:44px;
    height:44px;
    padding:0 11px;
    border:0;
    border-radius:12px;
    background:transparent;
    color:var(--accent-hi);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:16px;
    font-weight:650;
  }

  .topbtn:hover{background:var(--surface)}
  .topbtn:active{background:var(--surface-pressed);transform:scale(.97)}

  .toolIcon{
    display:grid;
    place-items:center;
    width:22px;height:22px;
    font-size:17px;
    line-height:1;
    font-weight:800;
  }

  #progressText{
    margin-right:8px;
    color:var(--secondary);
    font-size:15px;
    font-variant-numeric:tabular-nums;
  }

  /* ---------- Global page rhythm ---------- */
  .screen{
    padding:clamp(18px,3vw,32px) var(--page-x);
  }

  #menuScreen,
  #homeScreen{
    background:var(--bg);
  }

  .menuWrap{
    width:min(980px,100%);
  }

  .menuTitle{
    margin:10px 0 22px;
  }

  .menuTitle h2{
    font-size:clamp(36px,5vw,54px);
    line-height:1;
    letter-spacing:-.045em;
    font-weight:780;
  }

  .menuTitle p{
    margin-top:10px;
    color:var(--secondary);
    font-size:clamp(17px,2vw,20px);
    line-height:1.35;
  }

  /* ---------- Learn route: grouped native-style list, not card dashboard ---------- */
  .chapterList{
    gap:26px;
  }

  .chapterBlock{
    overflow:visible;
    border:0;
    border-radius:0;
    background:transparent;
  }

  .chapterHead{
    padding:0 2px 10px;
    border:0;
    display:grid;
    grid-template-columns:40px 1fr auto;
    gap:10px;
    align-items:center;
  }

  .chapterNo{
    width:34px;height:34px;
    border-radius:50%;
    border:0;
    background:var(--surface);
    color:var(--secondary);
    font-size:15px;
    font-weight:750;
  }

  .chapterHead h3{
    margin:0;
    color:var(--label);
    font-size:clamp(20px,2.5vw,26px);
    line-height:1.12;
    letter-spacing:-.025em;
    font-weight:720;
  }

  .chapterMeta{
    margin-top:3px;
    color:var(--tertiary);
    font-size:14px;
  }

  .lessonBtn{
    min-height:44px;
    border:0;
    border-radius:12px;
    padding:0 12px;
    background:transparent;
    color:var(--accent-hi);
    font-size:15px;
    font-weight:700;
  }

  .lessonBtn:hover{background:var(--surface)}
  .lessonBtn:active{background:var(--surface-pressed);transform:scale(.97)}

  .lessonBtn:disabled{
    opacity:.45;
    border:0;
    background:transparent;
    color:var(--tertiary);
  }

  .chapterMissions{
    display:block;
    padding:0;
    border-radius:var(--radius-lg);
    overflow:hidden;
    background:var(--surface);
    border:1px solid var(--separator);
  }

  .chapterMissions .levelCard{
    width:100%;
    min-height:68px;
    height:auto;
    margin:0;
    padding:11px 14px;
    border:0;
    border-radius:0;
    background:transparent;
    color:var(--label);
    display:grid;
    grid-template-columns:66px minmax(0,1fr) auto;
    grid-template-rows:auto auto;
    column-gap:12px;
    row-gap:2px;
    align-items:center;
    text-align:left;
    position:relative;
  }

  .chapterMissions .levelCard + .levelCard{
    border-top:1px solid var(--separator);
  }

  .chapterMissions .levelCard:hover{
    background:var(--surface-elevated);
  }

  .chapterMissions .levelCard:active{
    background:var(--surface-pressed);
    transform:none;
  }

  .chapterMissions .levelCard.done{
    border-color:inherit;
  }

  .chapterMissions .levelCard.locked{
    opacity:1;
    background:transparent;
    color:var(--tertiary);
  }

  .levelNo{
    grid-column:1;
    grid-row:1 / 3;
    align-self:center;
    color:var(--tertiary);
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
  }

  .levelName{
    grid-column:2;
    grid-row:1;
    margin:0;
    color:var(--label);
    font-size:18px;
    line-height:1.2;
    font-weight:680;
    letter-spacing:-.012em;
  }

  .levelKind{
    grid-column:2;
    grid-row:2;
    color:var(--tertiary);
    font-size:14px;
    line-height:1.25;
  }

  .levelState{
    grid-column:3;
    grid-row:1 / 3;
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:8px;
    color:var(--tertiary);
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
  }

  .doneMark{
    width:24px;height:24px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:var(--success);
    color:#061308;
    font-size:14px;
    font-weight:950;
  }

  .rowChevron{
    color:#737378;
    font-size:22px;
    font-weight:400;
    line-height:1;
  }

  .transferTag{
    display:inline;
    margin:0;
    padding:0;
    border:0;
    border-radius:0;
    background:transparent;
    color:var(--signal);
    font-size:13px;
    font-weight:700;
  }

  /* ---------- Game screen: canvas-first; no giant inner card ---------- */
  #gameScreen{
    padding-top:clamp(16px,2.5vw,26px);
  }

  .missionHead{
    width:min(1120px,100%);
    margin:0 auto 4px;
    padding:0;
  }

  .missionKicker{
    color:var(--accent-hi);
    font-size:12px;
    letter-spacing:.12em;
    font-weight:800;
  }

  .missionTitle{
    margin:5px 0 6px;
    max-width:100%;
    color:var(--label);
    font-size:clamp(34px,4.8vw,60px);
    line-height:.98;
    letter-spacing:-.052em;
    font-weight:790;
  }

  .missionText{
    color:var(--secondary);
    font-size:clamp(17px,1.9vw,20px);
    line-height:1.35;
    max-width:800px;
  }

  #gameArea{
    max-width:1120px;
  }

  .stage{
    min-height:240px;
    border:0;
    border-radius:0;
    background:transparent;
    overflow:visible;
  }

  /* Lesson capsule may have a surface because it is a self-contained content object. */
  .lessonVisual{
    background:var(--surface);
    border:1px solid var(--separator);
    border-radius:var(--radius-xl);
  }

  .lessonCopy{
    padding-left:2px;
  }

  .lessonEyebrow{
    color:var(--accent-hi);
  }

  .lessonBig{
    font-size:clamp(28px,4.2vw,48px);
    letter-spacing:-.042em;
    font-weight:780;
  }

  .lessonRule{
    max-width:520px;
    color:var(--secondary);
    font-size:clamp(17px,1.9vw,20px);
    line-height:1.45;
  }

  .lessonHint{
    color:var(--tertiary);
    font-size:14px;
  }

  .replayLesson{
    min-height:44px;
    border:0;
    background:rgba(0,0,0,.55);
    color:var(--accent-hi);
    border-radius:12px;
  }
  .replayLesson:active{transform:scale(.97)}

  /* ---------- Math content ---------- */
  .targetExpr{
    color:var(--label);
    font-weight:790;
    letter-spacing:-.035em;
  }

  .hintSmall{
    color:var(--tertiary);
  }

  .axis{
    background:#f2f2f7;
    height:4px;
  }

  .tick{
    background:#f2f2f7;
    width:2px;
    height:28px;
  }

  .tickLabel{
    color:var(--label);
    font-size:17px;
    font-weight:650;
  }

  .marker{
    width:22px;height:22px;
    border:4px solid var(--signal);
    background:#000;
    box-shadow:0 0 0 4px #000;
  }

  .intervalSeg{
    top:-17px;
    height:34px;
    border-radius:8px;
    background:#202326;
    border:1px solid #686b70;
  }

  .intervalSeg:hover{
    background:#292d31;
    border-color:#a5abb2;
  }

  .intervalSeg.selected{
    background:#173f55;
    border:2px solid var(--accent-hi);
    outline:0;
  }

  .numberLineLegend{
    color:var(--secondary);
    font-size:15px;
  }

  /* ---------- Answers / choices ---------- */
  .answerPanel .choice,
  .optionStack .choice{
    min-height:52px;
    border-radius:var(--radius-md);
    border:1px solid var(--separator-strong);
    background:var(--surface);
    color:var(--label);
    font-size:17px;
    font-weight:650;
    box-shadow:none;
  }

  .answerPanel .choice:hover,
  .optionStack .choice:hover{
    background:var(--surface-elevated);
    border-color:#74747a;
  }

  .answerPanel .choice:active,
  .optionStack .choice:active{
    background:var(--surface-pressed);
    transform:scale(.985);
  }

  .answerPanel .choice.selected,
  .optionStack .choice.selected{
    outline:0;
    border:2px solid var(--accent-hi);
    background:#102b3d;
  }

  .answerPanel .choice.selected::after,
  .optionStack .choice.selected::after{
    width:23px;height:23px;
    background:var(--accent);
    color:#fff;
    font-size:14px;
  }

  .gate{
    min-height:190px;
    border:2px solid var(--accent);
    border-radius:var(--radius-xl);
    background:#071923;
  }

  .decisionCol button{
    min-height:52px;
    border-radius:var(--radius-md);
    font-size:17px;
    font-weight:700;
  }

  .accept{
    background:var(--accent);
    color:#fff;
    border:0 !important;
  }
  .reject{
    background:var(--surface);
    color:var(--label);
    border:1px solid var(--separator-strong) !important;
  }

  .accept:active,.reject:active{transform:scale(.98)}

  .bigToken{
    background:var(--surface);
    border:1px solid var(--separator);
    border-radius:var(--radius-xl);
  }

  /* ---------- Bottom action bar ---------- */
  .footer{
    min-height:72px;
    padding:9px var(--page-x) max(9px,env(safe-area-inset-bottom));
    background:rgba(0,0,0,.97);
    border-top:1px solid var(--separator);
    gap:10px;
  }

  .instruction{
    color:var(--label);
    font-size:clamp(16px,1.8vw,19px);
    font-weight:650;
    line-height:1.28;
  }

  .feedback{
    color:var(--secondary);
    font-size:14px;
    font-weight:500;
  }

  .footer button{
    min-height:50px;
    min-width:96px;
    border-radius:14px;
    padding:0 17px;
    font-size:16px;
    font-weight:720;
  }

  #testBtn,#nextBtn{
    background:var(--accent);
    color:#fff;
    border:0;
  }

  #retryBtn{
    background:var(--surface);
    color:var(--label);
    border:1px solid var(--separator-strong);
  }

  #testBtn:disabled{
    background:var(--surface);
    color:#77777c;
    border:1px solid var(--separator);
  }

  #testBtn:not(:disabled):active,
  #nextBtn:active,
  #retryBtn:active{
    transform:scale(.97);
  }

  /* ---------- Home ---------- */
  .homeWrap{
    width:min(1040px,100%);
    gap:clamp(28px,5vw,64px);
  }

  .hero h1{
    max-width:720px;
    font-size:clamp(48px,6vw,78px);
    letter-spacing:-.058em;
    font-weight:790;
  }

  .hero p{
    max-width:650px;
    color:var(--secondary);
    font-size:clamp(18px,2vw,22px);
  }

  .primary,.secondary{
    min-height:50px;
    border-radius:14px;
    padding:0 18px;
    font-size:16px;
    font-weight:720;
  }

  .primary{
    background:var(--accent);
    color:#fff;
  }

  .secondary{
    background:var(--surface);
    color:var(--label);
    border:1px solid var(--separator-strong);
  }

  .primary:active,.secondary:active{transform:scale(.97)}

  .heroPanel{
    background:transparent;
    border:0;
    border-radius:0;
  }

  .heroAxis{background:#c7c7cc}
  .heroSignal{
    border-color:var(--signal);
    box-shadow:0 0 0 7px rgba(255,214,10,.08),0 0 28px rgba(255,214,10,.16);
  }

  /* ---------- Toast ---------- */
  #toast{
    background:#2c2c2e;
    border:1px solid #545458;
    color:#fff;
    border-radius:14px;
    font-size:15px;
  }
  #toast.ok{border-color:var(--success)}
  #toast.bad{border-color:var(--danger)}

  /* ---------- Touch + adaptive ---------- */
  button{
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
  }

  button:focus-visible{
    outline:3px solid var(--accent-hi);
    outline-offset:3px;
  }

  @media (max-width:700px){
    #app{grid-template-rows:56px 1fr auto}
    header{height:56px;min-height:56px}
    .brand span:last-child{font-size:17px}
    #progressText{display:none}

    .topbtn{
      padding:0 8px;
      gap:4px;
      font-size:15px;
    }

    .menuTitle{
      margin-top:6px;
      margin-bottom:18px;
    }

    .menuTitle h2{font-size:40px}
    .menuTitle p{font-size:17px}

    .chapterHead{
      grid-template-columns:34px 1fr auto;
    }

    .chapterMissions .levelCard{
      grid-template-columns:58px minmax(0,1fr) auto;
      padding:12px 12px;
    }

    .levelName{font-size:17px}
    .levelKind{font-size:13px}

    .missionTitle{
      font-size:clamp(34px,10vw,46px);
      line-height:1;
    }

    .lessonStage{
      padding:8px 0 12px;
      grid-template-columns:1fr;
    }

    .lessonVisual{
      min-height:220px;
      border-radius:18px;
    }

    .footer{
      min-height:78px;
      padding-left:12px;
      padding-right:12px;
    }

    .footer button{
      min-width:88px;
      padding-left:13px;
      padding-right:13px;
    }
  }

  @media (max-width:480px){
    .brand span:last-child{display:none}
    .toolbar{gap:0}
    .topbtn span:last-child{display:none}
    .topbtn{width:44px;padding:0}
    .toolIcon{font-size:18px}

    .chapterHead{
      grid-template-columns:32px 1fr auto;
      gap:8px;
    }

    .lessonBtn{
      width:44px;
      overflow:hidden;
      color:transparent;
      position:relative;
      padding:0;
    }
    .lessonBtn::after{
      content:"▶";
      color:var(--accent-hi);
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
    }

    .chapterMissions .levelCard{
      grid-template-columns:50px minmax(0,1fr) auto;
      column-gap:8px;
    }

    .levelNo{font-size:12px}
    .levelState .stateText{display:none}
  }

  @media (max-height:460px) and (orientation:landscape){
    #app{grid-template-rows:50px 1fr auto}
    header{height:50px;min-height:50px}
    .screen{padding-top:10px;padding-bottom:10px}
    .missionTitle{font-size:34px}
    .missionText{font-size:16px}
    .footer{min-height:60px;padding-top:5px;padding-bottom:5px}
    .footer button{min-height:46px}
  }

  @media (prefers-contrast: more){
    :root{
      --secondary:#ffffff;
      --tertiary:#e5e5ea;
      --separator:#636366;
      --separator-strong:#8e8e93;
    }
    .chapterMissions{border-width:2px}
    .lessonVisual{border-width:2px}
  }

  @media (prefers-reduced-motion: reduce){
    button:active{transform:none !important}
  }


  /* =========================================================
     v0.3.1 — restrained pro polish
     Goals:
     - lighter display typography
     - one role per accent color
     - canvas-first lesson/game surfaces
     - tighter rhythm and alignment
     - smaller status affordances
     - compact footer
     - CSS-drawn toolbar/replay icons
     ========================================================= */

  :root{
    --accent:#0a84ff;          /* UI action / focus only */
    --accent-hi:#64b5ff;
    --signal:#ffd60a;          /* math signal only */
    --surface:#1c1c1e;
    --surface-elevated:#232326;
    --surface-pressed:#2a2a2d;
    --separator:#343438;
    --separator-strong:#4a4a50;
    --secondary:#d1d1d6;
    --tertiary:#a1a1a8;
  }

  /* ---------- calmer typography ---------- */
  .hero h1{
    font-weight:710;
    letter-spacing:-.043em;
    line-height:.98;
  }

  .menuTitle h2{
    font-weight:700;
    letter-spacing:-.036em;
  }

  .missionTitle{
    font-weight:710;
    letter-spacing:-.038em;
    line-height:1;
  }

  .lessonBig{
    font-weight:700;
    letter-spacing:-.034em;
  }

  .chapterHead h3{
    font-weight:650;
    letter-spacing:-.018em;
  }

  .levelName{
    font-weight:630;
    letter-spacing:-.008em;
  }

  .instruction{
    font-weight:590;
  }

  .missionText,
  .lessonRule{
    color:var(--secondary);
    font-weight:400;
  }

  /* ---------- toolbar: actual line icons, not text glyphs ---------- */
  .toolIcon{
    width:22px;height:22px;
    position:relative;
    display:block;
    flex:0 0 22px;
  }

  .helpIcon{
    border:1.8px solid currentColor;
    border-radius:50%;
  }
  .helpIcon::before{
    content:"";
    position:absolute;
    left:9px; top:8px;
    width:2px; height:7px;
    border-radius:2px;
    background:currentColor;
  }
  .helpIcon::after{
    content:"";
    position:absolute;
    left:9px; top:5px;
    width:2px; height:2px;
    border-radius:50%;
    background:currentColor;
  }

  .menuIcon::before,
  .menuIcon::after{
    content:"";
    position:absolute;
    left:3px; right:3px;
    height:1.8px;
    border-radius:2px;
    background:currentColor;
  }
  .menuIcon::before{top:7px;box-shadow:0 7px 0 currentColor}
  .menuIcon::after{display:none}

  /* ---------- color discipline ---------- */
  .lessonBtn,
  .topbtn{
    color:var(--accent-hi);
  }

  .transferTag{
    color:var(--tertiary);
    font-weight:600;
  }
  .transferTag::before{
    content:"↗ ";
    color:var(--tertiary);
  }

  .marker,
  .heroSignal{
    border-color:var(--signal);
  }

  .marker{
    box-shadow:0 0 0 3px #000;
  }

  .answerPanel .choice.selected,
  .optionStack .choice.selected{
    border:1.5px solid var(--accent);
    background:#102235;
    outline:0;
  }

  .answerPanel .choice.selected::after,
  .optionStack .choice.selected::after{
    background:var(--accent);
  }

  .intervalSeg.selected{
    border:1.5px solid var(--accent);
    background:#102235;
    outline:0;
  }

  /* ---------- canvas first ---------- */
  .lessonStage{
    padding:clamp(12px,2vw,22px) 0;
    gap:clamp(18px,3vw,38px);
  }

  .lessonVisualWrap{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .lessonVisual{
    min-height:250px;
    border:0;
    border-radius:0;
    background:transparent;
    overflow:visible;
  }

  .replayLesson{
    position:static;
    align-self:flex-end;
    min-height:44px;
    border:0;
    border-radius:12px;
    padding:0 10px;
    display:inline-flex;
    align-items:center;
    gap:7px;
    background:transparent;
    color:var(--accent-hi);
    font-size:15px;
    font-weight:600;
  }

  .replayLesson:hover{background:var(--surface)}
  .replayLesson:active{background:var(--surface-pressed);transform:scale(.97)}

  .replayIcon{
    width:17px;height:17px;
    border:1.7px solid currentColor;
    border-right-color:transparent;
    border-radius:50%;
    position:relative;
    display:inline-block;
  }
  .replayIcon::after{
    content:"";
    position:absolute;
    right:-2px; top:-1px;
    width:5px;height:5px;
    border-top:1.7px solid currentColor;
    border-right:1.7px solid currentColor;
    transform:rotate(20deg);
  }

  /* ---------- route rhythm ---------- */
  .chapterList{
    gap:22px;
  }

  .chapterHead{
    padding:0 2px 9px;
  }

  .chapterMissions{
    border-color:var(--separator);
    border-radius:15px;
  }

  .chapterMissions .levelCard{
    min-height:64px;
    padding:10px 13px;
    grid-template-columns:54px minmax(0,1fr) auto;
    column-gap:10px;
  }

  .chapterMissions .levelCard + .levelCard{
    border-top-color:var(--separator);
  }

  .levelNo{
    font-size:12px;
    color:var(--tertiary);
    font-variant-numeric:tabular-nums;
  }

  .levelKind{
    color:var(--tertiary);
  }

  .levelState{
    gap:6px;
    font-size:13px;
    color:var(--tertiary);
  }

  .doneMark{
    width:18px;height:18px;
    font-size:11px;
    background:transparent;
    color:var(--success);
    border:1.5px solid var(--success);
  }

  .rowChevron{
    color:#69696f;
    font-size:18px;
    line-height:1;
  }

  /* ---------- number-line precision ---------- */
  .axis{
    height:3px;
    background:#e9e9ed;
    margin-top:36px;
  }

  .tick{
    width:1.5px;
    height:24px;
    background:#e9e9ed;
  }

  .tickLabel{
    top:24px;
    font-size:16px;
    font-weight:580;
    font-variant-numeric:tabular-nums;
    letter-spacing:0;
  }

  .tick.edge-left .tickLabel{
    left:0;
    right:auto;
    transform:translateX(-1px);
    text-align:left;
  }

  .tick.edge-right .tickLabel{
    left:auto;
    right:0;
    transform:translateX(1px);
    text-align:right;
  }

  .pointHit{
    top:-30px;
    height:66px;
  }

  .marker{
    width:20px;height:20px;
    border-width:3px;
  }

  .intervalSeg{
    top:-14px;
    height:28px;
    border-radius:7px;
    border-color:#5c5c62;
    background:#202023;
  }

  .numberLineLegend{
    margin-top:40px;
    color:var(--tertiary);
    font-size:14px;
  }

  /* ---------- lighter footer ---------- */
  .footer{
    min-height:62px;
    padding:6px var(--page-x) max(6px,env(safe-area-inset-bottom));
    background:#050505;
    border-top:1px solid #29292d;
    gap:8px;
  }

  .instruction{
    font-size:clamp(15px,1.6vw,17px);
    line-height:1.25;
  }

  .feedback{
    font-size:13px;
    color:var(--tertiary);
  }

  .footer button{
    min-height:46px;
    min-width:88px;
    border-radius:12px;
    padding:0 14px;
    font-size:15px;
  }

  /* ---------- no shadows, anywhere in interactive UI ---------- */
  .topbtn,
  .lessonBtn,
  .chapterMissions,
  .levelCard,
  .answerPanel .choice,
  .optionStack .choice,
  .footer button,
  .replayLesson{
    box-shadow:none !important;
  }

  /* ---------- richer but precise hero ---------- */
  .heroPanel{
    min-height:300px;
    display:grid;
    place-items:center;
  }

  .heroPlot{
    width:88%;
    height:210px;
    position:relative;
  }

  .heroAxis{
    position:absolute;
    left:5%; right:5%;
    top:52%;
    height:2px;
    background:#8e8e93;
  }

  .heroTick{
    position:absolute;
    top:-9px;
    width:1px;height:20px;
    background:#d1d1d6;
  }
  .ht1{left:10%}
  .ht2{left:35%}
  .ht3{left:65%}
  .ht4{left:90%}

  .heroSignal{
    left:58%;
    top:52%;
    width:24px;height:24px;
    border-width:3px;
    box-shadow:0 0 0 4px #000;
    transform:translate(-50%,-50%);
  }

  .heroSignal span{
    position:absolute;
    left:50%; top:-36px;
    transform:translateX(-50%);
    color:#fff;
    font-size:22px;
    font-weight:650;
    white-space:nowrap;
  }

  .heroBound{
    position:absolute;
    left:50%; bottom:22px;
    transform:translateX(-50%);
    color:var(--tertiary);
    font-size:15px;
    font-weight:560;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }

  /* ---------- compact, specific toast ---------- */
  #toast{
    top:12px;
    min-height:42px;
    padding:9px 13px;
    border:0;
    border-radius:12px;
    background:#2b2b2f;
    color:#fff;
    font-size:14px;
    font-weight:570;
    box-shadow:0 10px 28px rgba(0,0,0,.26);
  }

  #toast.ok::before{
    color:var(--success);
  }
  #toast.bad::before{
    color:var(--danger);
  }

  /* ---------- mobile ---------- */
  @media (max-width:700px){
    .chapterList{gap:18px}
    .chapterHead{padding-bottom:8px}

    .chapterMissions .levelCard{
      min-height:62px;
      grid-template-columns:46px minmax(0,1fr) auto;
      padding:10px 11px;
    }

    .missionTitle{
      font-size:clamp(32px,9vw,44px);
    }

    .lessonVisual{
      min-height:205px;
    }

    .footer{
      min-height:60px;
      padding-left:10px;
      padding-right:10px;
    }
  }

  @media (max-width:480px){
    .chapterMissions .levelCard{
      grid-template-columns:42px minmax(0,1fr) auto;
      column-gap:7px;
    }
    .doneMark{
      width:17px;height:17px;
    }
    .rowChevron{
      font-size:17px;
    }
  }

  @media (max-height:460px) and (orientation:landscape){
    .lessonStage{
      grid-template-columns:.85fr 1.15fr;
      gap:18px;
      padding:6px 0;
    }
    .lessonVisual{
      min-height:185px;
    }
    .footer{
      min-height:54px;
      padding-top:4px;
      padding-bottom:4px;
    }
    .footer button{
      min-height:44px;
    }
    .axis{
      margin-top:28px;
    }
    .numberLineLegend{
      margin-top:31px;
    }
  }


  /* =========================================================
     v0.4 — SPATIAL CANVAS / NO-CARDS
     Principle: a frame only exists when the frame itself has meaning.
     Hierarchy comes from scale, position, whitespace and motion.
     ========================================================= */

  :root{
    --bg:#000;
    --ink:#fff;
    --secondary:#c9c9ce;
    --tertiary:#8f8f96;
    --hairline:#2c2c30;
    --accent:#0a84ff;      /* interaction only */
    --signal:#ffd60a;      /* mathematical signal only */
    --success:#30d158;
    --danger:#ff453a;
  }

  /* ---------- Global ---------- */
  #app{
    background:#000;
  }

  header,
  .footer{
    background:#000;
    border-color:var(--hairline);
  }

  .screen{
    background:#000;
  }

  /* ---------- Home: no panel, no card ---------- */
  .homeWrap{
    grid-template-columns:1.05fr .95fr;
  }

  .heroPanel{
    background:transparent;
    border:0;
    min-height:320px;
  }

  .heroPlot{
    width:94%;
  }

  .primary,
  .secondary{
    background:transparent;
    border:0;
    color:var(--accent);
    padding:0 4px;
    min-height:44px;
    border-radius:8px;
  }

  .primary::after{
    content:" →";
  }

  .primary:hover,
  .secondary:hover{
    background:transparent;
    text-decoration:underline;
    text-underline-offset:5px;
  }

  .primary:active,
  .secondary:active{
    opacity:.58;
    transform:none;
  }

  /* ---------- Learn route: editorial list, zero containers ---------- */
  .chapterList{
    gap:30px;
  }

  .chapterBlock{
    background:transparent !important;
    border:0 !important;
    border-radius:0 !important;
    overflow:visible !important;
  }

  .chapterHead{
    grid-template-columns:42px minmax(0,1fr) auto;
    gap:12px;
    padding:0 0 11px;
    border:0;
  }

  .chapterNo{
    width:auto;
    height:auto;
    border:0;
    border-radius:0;
    background:transparent;
    color:var(--tertiary);
    font-size:13px;
    letter-spacing:.08em;
    font-variant-numeric:tabular-nums;
    align-self:start;
    padding-top:4px;
  }

  .chapterHead h3{
    font-size:clamp(21px,2.5vw,27px);
    font-weight:610;
  }

  .chapterMeta{
    font-size:13px;
    color:var(--tertiary);
  }

  .lessonBtn{
    min-height:44px;
    padding:0 2px;
    background:transparent !important;
    border:0 !important;
    border-radius:8px;
    color:var(--accent);
    font-weight:580;
  }

  .lessonBtn:hover{
    background:transparent !important;
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .chapterMissions{
    display:block;
    background:transparent !important;
    border:0 !important;
    border-radius:0 !important;
    overflow:visible !important;
  }

  .chapterMissions .levelCard{
    width:100%;
    min-height:58px;
    padding:9px 0 9px 54px;
    margin:0;
    border:0 !important;
    border-radius:0 !important;
    background:transparent !important;
    grid-template-columns:minmax(0,1fr) auto;
    grid-template-rows:auto auto;
    column-gap:14px;
    position:relative;
  }

  .chapterMissions .levelCard + .levelCard{
    border-top:0 !important;
  }

  .chapterMissions .levelCard::after{
    content:"";
    position:absolute;
    left:54px;
    right:0;
    bottom:0;
    height:1px;
    background:var(--hairline);
  }

  .chapterMissions .levelCard:last-child::after{
    display:none;
  }

  .chapterMissions .levelCard:hover{
    background:transparent !important;
  }

  .chapterMissions .levelCard:hover .levelName{
    color:var(--accent);
  }

  .chapterMissions .levelCard:active{
    opacity:.56;
  }

  .levelNo{
    position:absolute;
    left:0;
    top:13px;
    width:40px;
    grid-column:auto;
    grid-row:auto;
    color:#67676d;
    text-align:right;
    font-size:12px;
    letter-spacing:.04em;
  }

  .levelName{
    grid-column:1;
    grid-row:1;
    font-size:17px;
    font-weight:570;
    transition:color .12s ease;
  }

  .levelKind{
    grid-column:1;
    grid-row:2;
    font-size:13px;
  }

  .levelState{
    grid-column:2;
    grid-row:1 / 3;
    align-self:center;
    min-width:28px;
  }

  .doneMark{
    width:auto;
    height:auto;
    border:0;
    background:transparent;
    color:var(--success);
    font-size:14px;
  }

  .rowChevron{
    color:#5f5f65;
    font-size:17px;
  }

  .levelState .stateText{
    color:var(--tertiary);
    font-weight:500;
  }

  .transferTag{
    color:var(--tertiary);
    font-weight:500;
  }
  .transferTag::before{content:""}

  /* ---------- Mission canvas ---------- */
  .missionHead{
    margin-bottom:0;
  }

  #gameArea{
    align-items:center;
  }

  .stage{
    border:0 !important;
    border-radius:0 !important;
    background:transparent !important;
    overflow:visible !important;
  }

  /* ---------- Explanation: animation lives directly on the screen ---------- */
  .lessonStage{
    grid-template-columns:minmax(240px,.82fr) minmax(320px,1.18fr);
    padding:18px 0 10px;
  }

  .lessonVisualWrap{
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  .lessonVisual{
    border:0 !important;
    border-radius:0 !important;
    background:transparent !important;
    min-height:250px;
  }

  .replayLesson{
    align-self:center;
    color:var(--tertiary);
    min-height:44px;
  }

  .replayLesson:hover{
    color:var(--accent);
    text-decoration:none;
  }

  /* ---------- Number line: only the mathematical instrument remains ---------- */
  .axisWrap{
    width:min(1040px,96%);
  }

  .axis{
    height:2px;
    background:#dddde2;
    margin-left:44px;
    margin-right:44px;
  }

  .tick{
    width:1px;
    height:22px;
    background:#dddde2;
  }

  .tickLabel{
    color:#f5f5f7;
    font-weight:520;
  }

  .intervalSeg{
    top:-12px;
    height:24px;
    border:0 !important;
    border-radius:3px;
    background:rgba(255,255,255,.055);
  }

  .intervalSeg:hover{
    background:rgba(255,255,255,.10);
  }

  .intervalSeg.selected{
    border:0 !important;
    outline:0 !important;
    background:rgba(10,132,255,.28);
    box-shadow:inset 0 -2px 0 var(--accent);
  }

  .marker{
    width:16px;
    height:16px;
    border:3px solid var(--signal);
    background:#000;
    box-shadow:none;
  }

  /* ---------- Root answers: answer is the control ---------- */
  .shapeStage{
    background:transparent;
  }

  .answerPanel{
    gap:4px;
    align-items:flex-start;
  }

  .answerPanel .choice,
  .optionStack .choice{
    min-height:48px;
    padding:4px 8px;
    background:transparent !important;
    border:0 !important;
    border-radius:8px;
    color:#f5f5f7;
    text-align:left;
    font-size:clamp(24px,3.2vw,38px);
    font-weight:560;
  }

  .answerPanel .choice:hover,
  .optionStack .choice:hover{
    background:transparent !important;
    color:var(--accent);
  }

  .answerPanel .choice.selected,
  .optionStack .choice.selected{
    background:transparent !important;
    border:0 !important;
    color:#fff;
    box-shadow:inset 0 -2px 0 var(--accent);
  }

  .answerPanel .choice.selected::after,
  .optionStack .choice.selected::after{
    display:none;
  }

  /* ---------- Representation translation: pure spatial typography ---------- */
  .translateCanvas{
    display:grid;
    grid-template-columns:1fr auto 1.2fr;
    gap:clamp(24px,5vw,72px);
    align-items:center;
    justify-items:center;
    min-height:320px;
  }

  .translatePrompt{
    font-size:clamp(44px,8vw,96px);
    font-weight:640;
    letter-spacing:-.045em;
  }

  .translateEquals{
    color:#66666d;
    font-size:clamp(28px,4vw,48px);
    font-weight:400;
  }

  .translateCanvas .optionStack{
    width:100%;
    align-items:flex-start;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  /* ---------- Scanner: the screen itself is the sorting space ---------- */
  .spatialScanner{
    display:grid;
    grid-template-rows:auto 1fr auto auto;
    min-height:340px;
    padding:4px 4px 10px;
  }

  .scannerQuestion{
    text-align:center;
    font-size:clamp(52px,9vw,110px);
    font-weight:650;
    letter-spacing:-.05em;
    padding-top:4px;
  }

  .scannerWorld{
    width:min(820px,90%);
    margin:0 auto;
    position:relative;
    min-height:150px;
    display:grid;
    grid-template-columns:1fr 1px 1fr;
    align-items:center;
  }

  .scannerThreshold{
    height:94px;
    width:1px;
    background:#59595f;
    justify-self:center;
  }

  .scannerGateLabel{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    text-align:center;
    padding:0 18px;
    background:#000;
  }

  .gateTitle{
    font-size:clamp(24px,4vw,42px);
    font-weight:610;
    color:#fff;
  }

  .gateSub{
    color:var(--tertiary);
    font-size:13px;
    margin-top:4px;
  }

  .scannerFieldLabel{
    color:#5f5f66;
    font-size:11px;
    letter-spacing:.14em;
    text-align:center;
    font-weight:600;
  }

  .scannerFieldLabel.inside{
    color:#7d7d85;
  }

  .decisionCol{
    display:flex;
    flex-direction:row;
    justify-content:center;
    gap:clamp(34px,8vw,100px);
  }

  .decisionCol button{
    min-height:48px;
    padding:0 4px;
    border:0 !important;
    background:transparent !important;
    color:#f5f5f7;
    border-radius:8px;
    font-size:17px;
    font-weight:560;
  }

  .decisionCol button:hover{
    color:var(--accent);
  }

  .decisionCol button:active{
    opacity:.55;
    transform:none;
  }

  .accept::before,
  .reject::before{
    content:"" !important;
  }

  .decisionArrow{
    color:var(--tertiary);
    font-size:20px;
    vertical-align:-1px;
  }

  .queueProgress{
    text-align:center;
    color:#66666d;
    font-size:12px;
    padding-top:8px;
  }

  /* ---------- Footer: instruction strip, not control bar ---------- */
  .footer{
    min-height:54px;
    padding:4px var(--page-x) max(4px,env(safe-area-inset-bottom));
    border-top:1px solid #202024;
  }

  .instruction{
    font-size:15px;
    font-weight:520;
  }

  .feedback{
    font-size:12px;
    color:#88888f;
  }

  .footer button{
    min-height:44px;
    min-width:auto;
    padding:0 5px;
    border:0 !important;
    background:transparent !important;
    border-radius:8px;
    color:var(--accent) !important;
    font-size:15px;
    font-weight:600;
  }

  #testBtn::after{
    content:" →";
  }

  #nextBtn::after{
    content:" →";
  }

  #retryBtn{
    color:var(--secondary) !important;
  }

  #testBtn:disabled{
    color:#55555b !important;
    background:transparent !important;
  }

  .footer button:hover{
    text-decoration:underline;
    text-underline-offset:4px;
  }

  /* ---------- Toast: almost invisible system feedback ---------- */
  #toast{
    top:8px;
    min-height:38px;
    padding:8px 11px;
    background:#1c1c1f;
    border:0;
    border-radius:10px;
    box-shadow:none;
    font-size:13px;
  }

  /* ---------- Mobile: preserve spatial hierarchy, don't shrink into mini cards ---------- */
  @media(max-width:700px){
    .homeWrap{
      grid-template-columns:1fr;
    }

    .heroPanel{
      min-height:210px;
    }

    .chapterList{
      gap:24px;
    }

    .chapterHead{
      grid-template-columns:34px minmax(0,1fr) auto;
    }

    .chapterMissions .levelCard{
      min-height:56px;
      padding-left:46px;
    }

    .chapterMissions .levelCard::after{
      left:46px;
    }

    .levelNo{
      width:32px;
    }

    .lessonStage{
      grid-template-columns:1fr;
    }

    .lessonVisual{
      min-height:205px;
    }

    .translateCanvas{
      grid-template-columns:1fr;
      gap:8px;
      min-height:300px;
    }

    .translateEquals{
      display:block;
      transform:rotate(90deg);
      font-size:25px;
    }

    .translateCanvas .optionStack{
      align-items:center;
    }

    .answerPanel{
      align-items:center;
    }

    .scannerWorld{
      width:100%;
    }

    .decisionCol{
      gap:42px;
    }
  }

  @media(max-width:480px){
    .chapterHead{
      grid-template-columns:30px minmax(0,1fr) 44px;
    }

    .lessonBtn{
      width:44px;
      color:transparent;
      position:relative;
    }

    .lessonBtn::after{
      content:"↗";
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:var(--accent);
      font-size:18px;
    }

    .chapterMissions .levelCard{
      padding-left:40px;
    }

    .chapterMissions .levelCard::after{
      left:40px;
    }

    .levelNo{
      width:28px;
    }

    .levelState .stateText{
      display:none;
    }

    .scannerQuestion{
      font-size:clamp(48px,17vw,82px);
    }
  }

  @media(max-height:460px) and (orientation:landscape){
    .lessonStage{
      grid-template-columns:.8fr 1.2fr;
      padding:2px 0;
    }

    .lessonVisual{
      min-height:165px;
    }

    .spatialScanner{
      min-height:220px;
      grid-template-rows:auto 1fr auto;
    }

    .scannerQuestion{
      font-size:56px;
    }

    .scannerWorld{
      min-height:82px;
    }

    .queueProgress{
      display:none;
    }

    .translateCanvas{
      min-height:210px;
    }

    .footer{
      min-height:48px;
    }
  }


  /* =========================================================
     v0.5 — VISUAL LEVEL MAP
     Every chapter and mission is summarized as a small,
     programmed mathematical visual. No PNG assets.
     ========================================================= */

  .visualChapterList{
    display:flex;
    flex-direction:column;
    gap:clamp(30px,5vw,52px);
  }

  .visualChapterBlock{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .visualChapterHead{
    display:grid;
    grid-template-columns:112px minmax(0,1fr) auto;
    gap:18px;
    align-items:center;
  }

  .chapterVisualButton,
  .visualLevelButton{
    appearance:none;
    -webkit-appearance:none;
    font:inherit;
    color:inherit;
    cursor:pointer;
    background:transparent;
  }

  .chapterVisualButton{
    width:112px;
    height:112px;
    border:1px solid #333338;
    border-radius:18px;
    padding:0;
  }

  .chapterVisualButton:hover{
    border-color:#66666d;
  }

  .chapterVisualButton:active{
    transform:scale(.98);
    opacity:.72;
  }

  .chapterVisualButton.locked,
  .visualLevelButton.locked{
    opacity:.36;
    cursor:not-allowed;
  }

  .visualChapterInfo{
    min-width:0;
  }

  .visualChapterIndex{
    color:#727279;
    font-size:12px;
    letter-spacing:.12em;
    font-variant-numeric:tabular-nums;
    margin-bottom:4px;
  }

  .visualChapterInfo h3{
    margin:0;
    font-size:clamp(23px,3vw,31px);
    line-height:1.05;
    font-weight:620;
    letter-spacing:-.025em;
  }

  .visualChapterInfo p{
    margin:7px 0 0;
    color:var(--tertiary);
    font-size:14px;
  }

  .visualExplain{
    min-height:44px;
    padding:0 4px;
    border:0;
    background:transparent;
    color:var(--accent);
    font-size:15px;
    font-weight:570;
    cursor:pointer;
  }

  .visualExplain:hover{
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .visualExplain:disabled{
    opacity:.35;
    cursor:not-allowed;
    text-decoration:none;
  }

  .visualLevelGrid{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:12px;
  }

  .visualLevelButton{
    aspect-ratio:1 / 1;
    min-width:0;
    border:1px solid #2d2d32;
    border-radius:16px;
    padding:0;
    overflow:hidden;
    position:relative;
  }

  .visualLevelButton:hover{
    border-color:#5f5f67;
  }

  .visualLevelButton:hover .visualCaption{
    color:#fff;
  }

  .visualLevelButton:active{
    transform:scale(.985);

  /* ----- programmed mini mathematics ----- */

  .miniAxis{
    width:58%;
    height:2px;
    background:#bfc0c5;
    position:absolute;
    left:21%;
    top:53%;
  }
  .miniAxis::before,
  .miniAxis::after{
    content:"";
    position:absolute;
    top:-5px;
    width:1px;
    height:12px;
    background:#bfc0c5;
  }
  .miniAxis::before{left:0}
  .miniAxis::after{right:0}
  .miniAxis i{
    position:absolute;
    top:50%;
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--signal);
    transform:translate(-50%,-50%);
  }
  .miniAxis + b{
    position:absolute;
    top:20%;
    left:50%;
    transform:translateX(-50%);
  }

  .miniEq,
  .miniLess,
  .miniIntersect,
  .miniArrow,
  .miniNot{
    color:#74747b;
    font-weight:450;
  }

  .miniStop{
    color:#77777d;
    font-size:10px;
    margin-left:2px;
  }

  .miniPulse{
    color:var(--signal);
    font-size:.78em;
    padding-left:1px;
  }

  .miniSquare{
    width:42px;
    height:42px;
    border:2px solid #d5d5da;
    display:grid;
    place-items:center;
    position:relative;
    flex:0 0 auto;
  }

  .miniSquare b{
    font-size:14px;
  }

  .miniSide{
    color:#a6a6ac;
    font-size:12px;
  }

  .miniSet{
    width:31px;
    height:31px;
    border:1.5px solid #9d9da4;
    border-radius:50%;
    display:grid;
    place-items:center;
    font-size:13px;
    flex:0 0 auto;
  }

  .nset{border-color:#d5d5da}
  .zset{border-color:#b9b9c0}
  .qset{border-color:#98989f}
  .rset{border-color:#77777e}

  .miniInterval{
    width:58%;
    height:2px;
    background:#9d9da4;
    position:absolute;
    top:43%;
    left:21%;
  }

  .miniInterval::before,
  .miniInterval::after{
    content:"";
    position:absolute;
    top:50%;
    width:7px;
    height:7px;
    border:1.5px solid #d0d0d5;
    border-radius:50%;
    background:#000;
    transform:translateY(-50%);
  }
  .miniInterval::before{left:0}
  .miniInterval::after{right:0}

  .miniInterval.half::before{
    background:#d0d0d5;
  }

  .miniInterval + b{
    position:absolute;
    top:62%;
    font-size:13px;
  }

  .miniCube{
    width:38px;
    height:38px;

  /* =========================================================
     v0.5.1 — FLUID RESPONSIVE SCALING
     One layout system for small phones, A20 landscape,
     tablets, laptops, smartboards and large desktop screens.
     No uniform page shrinking: components reflow independently.
     ========================================================= */

  :root{
    --content-max:1180px;
    --page-pad:clamp(10px,2.4vw,30px);
    --ui-gap:clamp(8px,1.5vw,18px);
    --header-h:clamp(50px,7.5vh,58px);
    --footer-h:clamp(48px,7.5vh,62px);
  }

  html,body{
    min-width:280px;
    min-height:100%;
  }

  #app{
    width:100%;
    height:100vh;
    height:100dvh;
    min-height:320px;
    grid-template-rows:auto minmax(0,1fr) auto;
  }

  header{
    min-height:var(--header-h);
    padding:
      max(5px,env(safe-area-inset-top))
      var(--page-pad)
      5px;
    flex-wrap:nowrap;
    overflow:hidden;
  }

  main{
    min-width:0;
    min-height:0;
  }

  .screen{
    padding:clamp(10px,2vw,24px) var(--page-pad);
    min-width:0;
  }

  /* ---------- universal content width ---------- */
  .homeWrap,
  .menuWrap,
  .missionHead,
  #gameArea{
    width:min(var(--content-max),100%);
    max-width:var(--content-max);
    min-width:0;
  }

  /* ---------- Home reflows from split view to stacked ---------- */
  .homeWrap{
    grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);
    gap:clamp(20px,5vw,64px);
  }

  .hero h1{
    font-size:clamp(38px,min(6.2vw,9vh),78px);
  }

  .hero p{
    font-size:clamp(16px,min(2vw,3.4vh),22px);
  }

  .heroPanel{
    min-width:0;
    min-height:clamp(190px,38vh,320px);
  }

  .heroPlot{
    width:min(96%,620px);
    height:clamp(150px,30vh,230px);
  }

  /* ---------- visual level map: auto-fit instead of device breakpoints ---------- */
  .visualChapterHead{
    grid-template-columns:auto minmax(0,1fr) auto;
    gap:clamp(9px,1.8vw,18px);
  }

  .chapterVisualButton{
    inline-size:clamp(78px,12vw,112px);
    block-size:auto;
    aspect-ratio:1;
    container-type:inline-size;
    flex:none;

  .visualLevelGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));
    gap:clamp(8px,1.2vw,13px);
  }

  .visualLevelButton{
    width:100%;
    min-width:0;
    aspect-ratio:1 / 1;
    container-type:inline-size;
  }

  /* Tile typography now scales with the tile, not the viewport. */
  .visualGlyph{
    font-size:clamp(13px,11cqi,23px);
    gap:clamp(2px,3cqi,6px);
  }

  .chapterVisual .visualGlyph{
    font-size:clamp(12px,15cqi,19px);
  }

  .visualCaption{
    font-size:clamp(10px,6.8cqi,13px);
    min-height:clamp(27px,20cqi,38px);
    padding-top:clamp(4px,4cqi,8px);
  }

  .chapterVisual .visualCaption{
    font-size:clamp(9px,11cqi,12px);

  .levelVisual,

  .lessonStage{

  .lessonVisual{

  }

  /* ---------- Translate ---------- */
  .translateCanvas{
    width:100%;
    height:100%;
    min-height:0;
    grid-template-columns:minmax(0,1fr) auto minmax(0,1.2fr);
    gap:clamp(12px,4vw,64px);
  }

  .translatePrompt{

  }

  .translateEquals{

  }

  .spatialScanner{

    height:100%;
