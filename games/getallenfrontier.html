  /* =========================================================
     v0.6 — ORIENTATION HIERARCHY
     Three always-readable levels:
     COURSE → CHAPTER → CURRENT MISSION / ACTION.
     Colour reinforces chapter identity; number + name + shape
     duplicate the same information so colour is never essential.
     ========================================================= */

  /* ---------- gameplay orientation band ---------- */
  .contextBar{
    --chapter-color:#64D2FF;
    width:min(var(--content-max),100%);
    max-width:var(--content-max);
    margin:0 auto clamp(8px,1.6vh,14px);
    display:grid;
    grid-template-columns:minmax(190px,.85fr) minmax(260px,1.5fr) 72px;
    gap:clamp(12px,2.4vw,30px);
    align-items:center;
    min-height:72px;
    flex:0 0 auto;
  }

  .contextIdentity{
    min-width:0;
    display:grid;
    grid-template-columns:auto 5px minmax(0,1fr);
    gap:10px;
    align-items:stretch;
  }

  .contextChapterNo{
    align-self:center;
    color:#77777e;
    font-size:clamp(18px,2.2vw,28px);
    line-height:1;
    font-weight:560;
    font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;
  }

  .contextColorRail{
    width:5px;
    min-height:48px;
    border-radius:99px;
    background:var(--chapter-color);
  }

  .contextWords{
    min-width:0;
    align-self:center;
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .contextOverline{
    color:#85858c;
    font-size:11px;
    font-weight:620;
    letter-spacing:.07em;
    text-transform:uppercase;
    white-space:nowrap;
  }

  .contextWords strong{
    color:#f5f5f7;
    font-size:clamp(16px,1.8vw,21px);
    line-height:1.08;
    font-weight:620;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .contextProgress{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .contextProgressLabel{
    min-width:0;
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:#98989f;
    font-size:12px;
  }

  .contextProgressLabel span:first-child{
    color:#e5e5ea;
    font-weight:600;
  }

  .contextSteps{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:1fr;
    gap:5px;
    min-height:21px;
    align-items:center;
  }

  .contextStep{
    min-width:0;
    height:21px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6c6c72;
    font-size:9px;
    font-weight:700;
  }

  .contextStep i{
    position:absolute;
    left:0;right:0;
    top:9px;
    height:2px;
    border-radius:3px;
    background:#303034;
  }

  .contextStep b{
    opacity:0;
    transform:translateY(-7px);
    font-weight:700;
  }

  .contextStep.done i{
    background:#77777d;
  }

  .contextStep.current i{
    height:4px;
    top:8px;
    background:var(--chapter-color);
  }

  .contextStep.current b{
    opacity:1;
    color:var(--chapter-color);
  }

  .contextStep.locked{
    opacity:.42;
  }

  .contextVisual{
    width:64px;
    height:64px;
    justify-self:end;
    position:relative;
    color:#fff;
  }

  .contextVisual .levelVisual,
  .contextVisual .chapterVisual{
    padding:5px;
    grid-template-rows:1fr;
    border-radius:13px;
    background:#101012;
  }

  .contextVisual .visualGlyph{
    font-size:12px;
  }

  .contextVisual .visualCaption,
  .contextVisual .visualDone,
  .contextVisual .visualLock{
    display:none;
  }

  .contextVisual .miniSquare,
  .contextVisual .miniCube{
    width:25px;height:25px;
  }

  .contextVisual .miniSet{
    width:22px;height:22px;
    font-size:9px;
  }

  /* The chapter colour owns the chapter label, not the general UI. */
  #gameScreen .missionKicker{
    color:var(--chapter-color);
  }

  /* ---------- course map: chapter is a broad spatial zone ---------- */
  .visualChapterList{
    gap:clamp(38px,6vw,68px);
  }

  .visualChapterBlock{
    --chapter-color:#64D2FF;
    display:grid;
    grid-template-columns:minmax(190px,240px) minmax(0,1fr);
    gap:clamp(22px,4vw,54px);
    align-items:start;
    position:relative;
    padding-left:14px;
  }

  .visualChapterBlock::before{
    content:"";
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:4px;
    border-radius:99px;
    background:#252529;
  }

  .visualChapterBlock.currentChapter::before{
    background:var(--chapter-color);
  }

  .visualChapterBlock.chapterDone::before{
    background:#5b5b61;
  }

  .chapterOverview{
    min-width:0;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
    position:sticky;
    top:4px;
  }

  .chapterHeading{
    display:grid;
    grid-template-columns:5px minmax(0,1fr);
    gap:10px;
    align-items:stretch;
    width:100%;
  }

  .chapterRail{
    border-radius:99px;
    background:var(--chapter-color);
    min-height:56px;
  }

  .visualChapterIndex{
    color:var(--chapter-color);
    font-size:11px;
    font-weight:700;
    letter-spacing:.09em;
    font-variant-numeric:tabular-nums;
  }

  .chapterHeading h3{
    margin:3px 0 0;
    color:#f5f5f7;
    font-size:clamp(21px,2.3vw,29px);
    line-height:1.03;
    font-weight:620;
    letter-spacing:-.024em;
  }

  .chapterHeading p{
    margin:6px 0 0;
    color:#93939a;
    font-size:13px;
    line-height:1.25;
  }

  .chapterVisualButton{
    inline-size:clamp(92px,10vw,116px);
    border:0;
    border-radius:18px;
    background:#111113;
    position:relative;
    overflow:hidden;
  }

  .chapterVisualButton::before{
    content:"";
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:var(--chapter-color);
    z-index:2;
  }

  .chapterVisualButton:hover{
    border:0;
    background:#171719;
  }

  .chapterVisualButton .visualGlyph{
    color:#fff;
  }

  .chapterVisualButton .visualCaption{
    color:#b8b8bf;
  }

  .visualExplain{
    color:var(--chapter-color);
  }

  .chapterMissionArea{
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-top:2px;
  }

  .chapterMissionHead{
    min-height:24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    color:#77777e;
    font-size:10px;
    font-weight:700;
    letter-spacing:.12em;
  }

  .chapterMiniProgress{
    min-width:86px;
    display:flex;
    justify-content:flex-end;
    gap:5px;
  }

  .chapterMiniProgress i{
    display:block;
    width:16px;
    height:3px;
    border-radius:4px;
    background:#303034;
  }

  .chapterMiniProgress i.done{
    background:#696970;
  }

  .chapterMiniProgress i.current{
    height:5px;
    margin-top:-1px;
    background:var(--chapter-color);
  }

  .visualLevelGrid{
    grid-template-columns:repeat(auto-fit,minmax(min(138px,100%),1fr));
    gap:clamp(9px,1.1vw,13px);
  }

  .visualLevelButton{
    border:0;
    border-radius:16px;
    background:#101012;
    position:relative;
    isolation:isolate;
  }

  .visualLevelButton::before{
    content:"";
    position:absolute;
    left:0;right:0;top:0;
    height:3px;
    background:#252529;
    z-index:3;
  }

  .visualLevelButton:hover{
    border:0;
    background:#161618;
  }

  .visualLevelButton.done{
    background:#0d0d0f;
  }

  .visualLevelButton.current{
    background:#151517;
  }

  .visualLevelButton.current::before{
    height:5px;
    background:var(--chapter-color);
  }

  .visualLevelButton.current .visualGlyph{
    color:#fff;
  }

  .visualLevelButton.current .visualCaption{
    color:#fff;
    font-weight:570;
  }

  .visualLevelButton.locked{
    background:#09090a;
  }

  .youAreHere{
    position:absolute;
    top:8px;
    left:9px;
    z-index:4;
    color:var(--chapter-color);
    font-size:9px;
    line-height:1;
    letter-spacing:.09em;
    font-weight:800;
  }

  .visualDone{
    color:#b7b7bd;
  }

  /* Meaningful visual levels stay square, but hierarchy comes from scale:
     chapter visual > current level > normal level. */
  .currentChapter .chapterVisualButton{
    inline-size:clamp(102px,11vw,124px);
  }

  /* ---------- mission hierarchy ---------- */
  .missionHead{
    padding-top:clamp(2px,.7vh,7px);
    padding-bottom:clamp(3px,.8vh,8px);
  }

  .missionTitle{
    max-width:900px;
  }

  .missionText{
    max-width:760px;
  }

  /* ---------- compact screens ---------- */
  @media(max-width:820px){
    .contextBar{
      grid-template-columns:minmax(150px,.85fr) minmax(180px,1.35fr);
    }

    .contextVisual{
      display:none;
    }

    .visualChapterBlock{
      grid-template-columns:minmax(150px,190px) minmax(0,1fr);
      gap:20px;
    }

    .visualLevelGrid{
      grid-template-columns:repeat(auto-fit,minmax(min(128px,100%),1fr));
    }
  }

  @media(max-width:640px){
    .contextBar{
      grid-template-columns:1fr;
      gap:7px;
      min-height:auto;
      margin-bottom:8px;
    }

    .contextIdentity{
      grid-template-columns:auto 4px minmax(0,1fr);
    }

    .contextColorRail{
      min-height:34px;
      width:4px;
    }

    .contextWords strong{
      font-size:16px;
    }

    .contextOverline{
      font-size:9px;
    }

    .contextProgress{
      gap:4px;
    }

    .contextProgressLabel{
      font-size:10px;
    }

    .contextProgressLabel span:last-child{
      display:none;
    }

    .contextSteps{
      min-height:12px;
      gap:4px;
    }

    .contextStep{
      height:12px;
    }

    .contextStep i{
      top:5px;
    }

    .contextStep.current i{
      top:4px;
    }

    .contextStep b{
      display:none;
    }

    .visualChapterBlock{
      grid-template-columns:1fr;
      gap:14px;
      padding-left:10px;
    }

    .chapterOverview{
      position:static;
      display:grid;
      grid-template-columns:auto minmax(0,1fr) 44px;
      grid-template-areas:
        "visual heading explain";
      gap:12px;
      align-items:center;
    }

    .chapterHeading{
      grid-area:heading;
    }

    .chapterVisualButton{
      grid-area:visual;
      inline-size:86px;
    }

    .currentChapter .chapterVisualButton{
      inline-size:92px;
    }

    .visualExplain{
      grid-area:explain;
      width:44px;
      overflow:hidden;
      color:transparent;
      position:relative;
      padding:0;
    }

    .visualExplain::after{
      content:"↗";
      position:absolute;
      inset:0;
      display:grid;
      place-items:center;
      color:var(--chapter-color);
      font-size:18px;
    }

    .chapterMissionHead{
      padding-left:2px;
    }

    .visualLevelGrid{
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
    }

    .chapterHeading h3{
      font-size:clamp(19px,6vw,24px);
    }

    .chapterHeading p{
      font-size:11px;
    }
  }

  @media(max-width:370px){
    .chapterOverview{
      grid-template-columns:76px minmax(0,1fr) 40px;
      gap:8px;
    }

    .chapterVisualButton,
    .currentChapter .chapterVisualButton{
      inline-size:76px;
    }

    .chapterHeading p{
      display:none;
    }

    .visualLevelGrid{
      gap:7px;
    }
  }

  /* Low landscape: preserve the orientation cue but compress it. */
  @media(max-height:500px) and (orientation:landscape){
    .contextBar{
      min-height:42px;
      margin-bottom:4px;
      grid-template-columns:minmax(165px,.7fr) minmax(240px,1.5fr) 48px;
      gap:12px;
    }

    .contextChapterNo{
      font-size:18px;
    }

    .contextColorRail{
      min-height:34px;
      width:4px;
    }

    .contextOverline{
      font-size:8px;
    }

    .contextWords strong{
      font-size:14px;
    }

    .contextProgress{
      gap:3px;
    }

    .contextProgressLabel{
      font-size:9px;
    }

    .contextSteps{
      min-height:11px;
    }

    .contextStep{
      height:11px;
    }

    .contextStep i{top:5px}
    .contextStep.current i{top:4px}

    .contextVisual{
      width:44px;height:44px;
    }

    .contextVisual .levelVisual,
    .contextVisual .chapterVisual{
      border-radius:9px;
      padding:3px;
    }

    .missionHead{
      padding-top:0;
      padding-bottom:1px;
    }

    /* Menu remains scannable: chapter label at left, missions at right. */
    .visualChapterBlock{
      grid-template-columns:160px minmax(0,1fr);
      gap:18px;
    }

    .chapterOverview{
      position:static;
    }

    .chapterVisualButton,
    .currentChapter .chapterVisualButton{
      inline-size:78px;
    }

    .chapterHeading h3{
      font-size:18px;
    }

    .chapterHeading p{
      font-size:10px;
    }

    .visualLevelGrid{
      grid-template-columns:repeat(auto-fit,minmax(112px,1fr));
    }
  }


  /* =========================================================
     v0.7 — VISUAL CHAPTER NAVIGATION
     Top: all major chapters as small visual windows.
     Below: only the selected chapter and its large visual levels.
     Completion is remembered with localStorage on the same browser.
     ========================================================= */

  #menuScreen{
    --menu-content-max:1180px;
  }

  .menuWrap{
    width:min(var(--menu-content-max),100%);
    max-width:var(--menu-content-max);
  }

  .menuTitle{
    margin-bottom:clamp(14px,2.5vw,24px);
  }

  /* ---------- chapter strip ---------- */
  .chapterSelector{
    width:100%;
    display:grid;
    grid-template-columns:repeat(9,minmax(82px,1fr));
    gap:clamp(7px,1vw,11px);
    padding:3px 1px 10px;
    overflow-x:auto;
    overscroll-behavior-inline:contain;
    scrollbar-width:thin;
    scroll-snap-type:x proximity;
  }

  .chapterTab{
    --chapter-color:#64D2FF;
    aspect-ratio:1 / 1;
    min-width:82px;
    border:1px solid #2f2f34;
    border-radius:16px;
    background:#0d0d0f;
    color:#fff;
    padding:9px 8px 8px;
    position:relative;
    display:grid;
    grid-template-rows:auto 1fr auto auto;
    justify-items:center;
    gap:3px;
    cursor:pointer;
    scroll-snap-align:center;
    transition:
      background .16s ease,
      border-color .16s ease,
      transform .16s ease,
      opacity .16s ease;
  }

  .chapterTab::after{
    content:"";
    position:absolute;
    left:10px;
    right:10px;
    bottom:5px;
    height:3px;
    border-radius:99px;
    background:#29292d;
  }

  .chapterTab:hover{
    background:#151517;
    border-color:#55555c;
  }

  .chapterTab:active{
    transform:scale(.98);
  }

  .chapterTab.selected{
    background:color-mix(in srgb,var(--chapter-color) 14%,#0d0d0f);
    border-color:color-mix(in srgb,var(--chapter-color) 70%,#fff 8%);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--chapter-color) 28%,transparent);
    transform:translateY(-2px);
  }

  .chapterTab.selected::after{
    background:var(--chapter-color);
    height:4px;
  }

  .chapterTab.done{
    background:color-mix(in srgb,var(--chapter-color) 8%,#0d0d0f);
  }

  .chapterTab.current:not(.selected)::after{
    background:var(--chapter-color);
  }

  .chapterTabNo{
    justify-self:start;
    color:#74747b;
    font-size:10px;
    letter-spacing:.1em;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .chapterTabVisual{
    width:100%;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:3px;
    color:#f5f5f7;
    font-size:clamp(11px,1.25vw,17px);
    font-weight:590;
    overflow:hidden;
  }

  .chapterTabVisual .miniSquare,
  .chapterTabVisual .miniCube{
    width:28px;height:28px;
  }

  .chapterTabVisual .miniSet{
    width:24px;height:24px;
    font-size:9px;
  }

  .chapterTabVisual .miniAxis,
  .chapterTabVisual .miniInterval{
    width:62%;
    left:19%;
  }

  .chapterTabTitle{
    width:100%;
    min-width:0;
    color:#c8c8ce;
    font-size:10px;
    line-height:1.08;
    font-weight:560;
    text-align:center;
    overflow:hidden;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
  }

  .chapterTabProgress{
    color:#77777e;
    font-size:9px;
    font-variant-numeric:tabular-nums;
    padding-bottom:4px;
  }

  .chapterTab.selected .chapterTabTitle{
    color:#fff;
  }

  .chapterTab.selected .chapterTabNo,
  .chapterTab.selected .chapterTabProgress{
    color:color-mix(in srgb,var(--chapter-color) 72%,white);
  }

  /* ---------- selected chapter ---------- */
  .selectedChapterView{
    --chapter-color:#64D2FF;
    margin-top:clamp(18px,3vw,30px);
    padding-top:clamp(16px,2.6vw,26px);
    border-top:1px solid #26262a;
  }

  .selectedChapterHead{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:18px;
    margin-bottom:12px;
  }

  .selectedChapterIdentity{
    min-width:0;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    gap:12px;
    align-items:start;
  }

  .selectedChapterNo{
    width:44px;
    height:44px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:color-mix(in srgb,var(--chapter-color) 14%,#111);
    color:var(--chapter-color);
    font-size:14px;
    font-weight:730;
    font-variant-numeric:tabular-nums;
  }

  .selectedChapterEyebrow{
    color:var(--chapter-color);
    font-size:11px;
    font-weight:690;
    letter-spacing:.075em;
    text-transform:uppercase;
  }

  .selectedChapterHead h3{
    margin:3px 0 5px;
    color:#fff;
    font-size:clamp(28px,4vw,44px);
    line-height:1;
    font-weight:650;
    letter-spacing:-.035em;
  }

  .selectedChapterHead p{
    margin:0;
    color:#a8a8af;
    font-size:clamp(13px,1.5vw,16px);
  }

  .selectedLessonAction{
    min-height:44px;
    border:0;
    background:transparent;
    color:var(--chapter-color);
    padding:0 2px;
    font-size:15px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
  }

  .selectedLessonAction:hover{
    text-decoration:underline;
    text-underline-offset:4px;
  }

  .selectedLessonAction:disabled{
    color:#55555c;
    cursor:not-allowed;
    text-decoration:none;
  }

  .selectedChapterProgress{
    display:grid;
    grid-auto-flow:column;
    grid-auto-columns:1fr;
    gap:6px;
    margin:14px 0 clamp(18px,2.6vw,28px);
  }

  .selectedChapterProgress span{
    height:18px;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    color:#696970;
    font-size:9px;
    font-weight:700;
  }

  .selectedChapterProgress i{
    position:absolute;
    left:0;right:0;bottom:0;
    height:3px;
    border-radius:99px;
    background:#2c2c31;
  }

  .selectedChapterProgress span.done i{
    background:color-mix(in srgb,var(--chapter-color) 55%,#6b6b71);
  }

  .selectedChapterProgress span.current{
    color:var(--chapter-color);
  }

  .selectedChapterProgress span.current i{
    height:5px;
    background:var(--chapter-color);
  }

  /* ---------- large visual level buttons ---------- */
  .selectedLevelGrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(min(174px,100%),1fr));
    gap:clamp(10px,1.4vw,15px);
  }

  .selectedLevelButton{
    --chapter-color:#64D2FF;
    width:100%;
    min-width:0;
    aspect-ratio:1 / 1;
    border:1px solid #303036;
    border-radius:19px;
    background:#0e0e10;
    color:#fff;
    padding:0;
    position:relative;
    overflow:hidden;
    cursor:pointer;
    container-type:inline-size;
    transition:
      transform .14s ease,
      border-color .14s ease,
      background .14s ease;
  }

  .selectedLevelButton:hover{
    background:#151517;
    border-color:#55555d;
  }

  .selectedLevelButton:active{
    transform:scale(.985);
  }

  .selectedLevelButton.current{
    border-color:var(--chapter-color);
    background:color-mix(in srgb,var(--chapter-color) 12%,#101012);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--chapter-color) 20%,transparent);
  }

  .selectedLevelButton.done{
    background:color-mix(in srgb,var(--chapter-color) 16%,#0b0b0d);
    border-color:color-mix(in srgb,var(--chapter-color) 36%,#303036);
  }

  .selectedLevelButton.locked{
    opacity:.32;
    background:#09090a;
    cursor:not-allowed;
  }

  .selectedLevelButton .levelVisual{
    padding:clamp(12px,8cqi,19px) clamp(9px,7cqi,16px) clamp(10px,7cqi,15px);
    display:grid;
    grid-template-rows:minmax(0,1fr) auto auto;
    gap:clamp(4px,3.5cqi,8px);
  }

  .selectedLevelButton .visualGlyph{
    min-height:0;
    font-size:clamp(16px,12cqi,29px);
    gap:clamp(2px,3cqi,7px);
    color:#fff;
  }

  .selectedLevelButton .visualTitle{
    width:100%;
    color:#f5f5f7;

<div id="app">

<script>
(() => {

    levelIndex: Number.isFinite(storedLastLevel) ? Math.max(0,Math.min(27,storedLastLevel)) : 0,

    state.lessonReturnLevel = returnLevel;
    el.kicker.textContent = `DYNAMISCHE UITLEG · BLOK ${ci+1}`;
    el.title.textContent = c.title;
    el.text.textContent = 'Kijk eerst naar wat er verandert — en vooral naar wat hetzelfde blijft.';
    el.instruction.textContent = returnLevel == null
      ? 'Bekijk de korte uitleg. Start daarna de oefeningen.'
      : 'Bekijk of herbekijk deze uitleg, en keer daarna terug naar je huidige missie.';
    el.feedback.textContent = '';
    el.test.style.display='none';
    el.retry.style.display='none';
    el.next.style.display='inline-block';
    el.next.textContent = returnLevel == null ? 'START OEFENINGEN' : 'TERUG NAAR MISSIE';
    el.gameArea.innerHTML = `<div class="stage"><div class="lessonStage">
      <div class="lessonCopy">
        <div class="lessonEyebrow">CONCEPTCAPSULE</div>

        <div class="lessonRule">${c.rule}</div>
        <div class="lessonHint">${c.hint}</div>

      </div>
    </div></div>`;

    renderContextBar(ci, c.first, true);
    el.progress.textContent = `hoofdstuk ${ci+1}/${chapters.length} · uitleg`;

  function getResumeIndex(){
    const last=Math.max(0,Math.min(levels.length-1,state.levelIndex));
    if(last < state.unlocked && !state.done.includes(last)) return last;

    for(let i=0;i<Math.min(state.unlocked,levels.length);i++){
      if(!state.done.includes(i)) return i;
    }

    return Math.max(0,Math.min(levels.length-1,state.unlocked-1));
  }

  function save(){
    localStorage.setItem('gf_unlocked', String(state.unlocked));
    localStorage.setItem('gf_done', JSON.stringify(state.done));
    localStorage.setItem('gf_last_level', String(state.levelIndex));
    localStorage.setItem('gf_selected_chapter', String(state.selectedChapter));
    localStorage.setItem('gf_route_open', state.routeOpen ? '1' : '0');
    localStorage.setItem('gf_header_collapsed', state.headerCollapsed ? '1' : '0');
    localStorage.setItem('gf_medals', JSON.stringify(state.medals));
    localStorage.setItem('gf_wrong_items', JSON.stringify(state.wrongItems));
  }

  function showScreen(id){
    screens.forEach(s=>s.classList.toggle('active', s.id===id));

    if(id==='menuScreen'){
      renderMenu();
    }

    if(id==='gameScreen'){
      const ci=chapterForLevel(state.levelIndex);
      el.progress.textContent = ci>=0
        ? `${String(ci+1).padStart(2,'0')}/${String(chapters.length).padStart(2,'0')} · ${state.levelIndex+1}/${levels.length}`
        : '';
    } else {
      el.progress.textContent='';
    }
  }

  function renderContextBar(ci, levelIndex, lesson=false){
    const bar=qs('#contextBar');
    if(!bar || ci<0 || !chapters[ci]) return;

    const c=chapters[ci];
    const localLevels=[];
    for(let i=c.first;i<=c.last;i++) localLevels.push(i);

    const segments=localLevels.map((i,k)=>{
      const done=state.done.includes(i);
      const current=!lesson && i===levelIndex;
      const unlocked=true;
      const cls=[
        'contextStep',
        done?'done':'',
        current?'current':'',
        unlocked?'unlocked':'locked'
      ].filter(Boolean).join(' ');
      return `<span class="${cls}" title="${levels[i].title}" aria-label="Missie ${i+1}: ${levels[i].title}">
        <i></i><b>${k+1}</b>
      </span>`;
    }).join('');

    const localNo = lesson ? 'Uitleg' : `Missie ${levelIndex-c.first+1} van ${c.last-c.first+1}`;
    const totalNo = lesson ? `Hoofdstuk ${ci+1} van ${chapters.length}` : `${levelIndex+1} / ${levels.length}`;

    bar.style.setProperty('--chapter-color',chapterColors[ci]);
    qs('#gameScreen').style.setProperty('--chapter-color',chapterColors[ci]);

    bar.innerHTML=`
      <div class="contextIdentity">
        <span class="contextChapterNo">${String(ci+1).padStart(2,'0')}</span>
        <span class="contextColorRail" aria-hidden="true"></span>
        <div class="contextWords">
          <span class="contextOverline">${totalNo}</span>
          <strong>${chapterShort[ci]}</strong>
        </div>
      </div>

      <div class="contextProgress">
        <div class="contextProgressLabel">
          <span>${localNo}</span>
          <span>${lesson ? 'eerst begrijpen, dan oefenen' : levels[levelIndex].kind}</span>
        </div>
        <div class="contextSteps">${segments}</div>
      </div>

      <div class="contextVisual" aria-hidden="true">
        ${lesson ? visualButtonHTML(chapterVisuals[ci],'',false,false,true) : visualButtonHTML(levelVisuals[levelIndex],'',false,false,false)}
      </div>`;
  }


  function tileSvg(inner, extraClass=''){
    return `<svg class="mathTileSVG ${extraClass}" viewBox="0 0 240 130" preserveAspectRatio="xMidYMid meet" aria-hidden="true">

  }

  function txt(x,y,t,size=18,cls='svgText',anchor='middle',weight=650){
    return `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}" font-size="${size}" font-weight="${weight}">${t}</text>`;
  }


  function svgFraction(x,y,num,den,size=13,cls='svgText'){
    const half=Math.max(12,String(num).length*size*.34,String(den).length*size*.34);
    return `
      ${txt(x,y-size*.52,num,size,cls,'middle',720)}
      ${line(x-half,y-2,x+half,y-2,'svgMainLine',1.6)}
      ${txt(x,y+size*.72,den,size,cls,'middle',720)}
    `;
  }

  function line(x1,y1,x2,y2,cls='svgLine',w=2){
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}" stroke-width="${w}" />`;
  }

  function circle(cx,cy,r,cls='svgAccentDot',filled=true){
    return `<circle cx="${cx}" cy="${cy}" r="${r}" class="${cls}" ${filled?'':'fill="var(--tile-bg,#08121c)"'} />`;
  }

  function axisVisual(minLabel,maxLabel,pointX,pointLabel,ticks=6){
    let tickMarkup='';
    for(let i=0;i<=ticks;i++){
      const x=28+(184*i/ticks);
      tickMarkup+=line(x,66,x,75,'svgMutedLine',1.5);
    }
    return tileSvg(`
      ${txt(pointX,34,pointLabel,25,'svgText','middle',760)}
      ${line(28,70,212,70,'svgMainLine',2.5)}
      ${tickMarkup}
      ${circle(pointX,70,6,'svgSignalDot')}
      ${txt(28,97,minLabel,14,'svgMutedText','middle',600)}
      ${txt(212,97,maxLabel,14,'svgMutedText','middle',600)}
    `,'axisSvg');
  }

  function renderMenu(){
    const selector=qs('#chapterSelector');
    const view=qs('#selectedChapterView');
    if(!selector || !view) return;

    const currentIndex=getResumeIndex();
    const currentChapter=chapterForLevel(currentIndex);

    if(state.selectedChapter<0 || state.selectedChapter>=chapters.length){
      state.selectedChapter=Math.max(0,currentChapter);
    }

    selector.innerHTML='';

    chapters.forEach((c,ci)=>{
      const chapterLevels=Array.from({length:c.last-c.first+1},(_,k)=>c.first+k);
      const completedCount=chapterLevels.filter(i=>state.done.includes(i)).length;
      const chapterDone=completedCount===chapterLevels.length;
      const allGold=chapterLevels.every(i=>state.medals[i]==='gold');
      const chapterMedal=allGold ? 'gold' : chapterDone ? 'silver' : '';
      const selected=ci===state.selectedChapter;
      const current=ci===currentChapter && !chapterDone;

      const b=document.createElement('button');
      b.type='button';
      b.dataset.chapter=String(ci);
      b.className='chapterTab'+
        (selected?' selected':'')+
        (chapterDone?' done':'')+
        (current?' current':'')+
        (chapterMedal?` ${chapterMedal}`:'');
      b.style.setProperty('--chapter-color',chapterColors[ci]);
      b.setAttribute('aria-selected',selected?'true':'false');

      b.innerHTML=`
        <span class="chapterTabHead">
          <span class="chapterTabNo">${String(ci+1).padStart(2,'0')}</span>
          <span class="chapterTabProgress">${completedCount}/${chapterLevels.length}</span>
        </span>
        <span class="chapterTabVisual">${chapterVisuals[ci].mini}</span>
        <span class="chapterTabTitle">${chapterShort[ci]}</span>
        <span class="chapterTabSubtitle">${chapterVisuals[ci].text}</span>
        ${selected?'<span class="chapterSelectedPill">Geselecteerd</span>':''}
        ${chapterMedal==='gold'?'<span class="chapterCrown">♛</span>':''}
      `;

      b.addEventListener('click',()=>{
        if(state.selectedChapter===ci){
          const target=chapterLevels.find(i=>state.medals[i]!=='gold') ?? chapterLevels[0];
          loadLevel(target);
          return;
        }
        state.selectedChapter=ci;
        state.selectedLevelTile=null;
        localStorage.setItem('gf_selected_chapter',String(ci));
        renderMenu();
        requestAnimationFrame(()=>{
          selector.querySelector('.chapterTab.selected')?.scrollIntoView({
            behavior:'smooth',block:'nearest',inline:'center'
          });
        });
      });

      selector.appendChild(b);
    });

    const ci=state.selectedChapter;
    const c=chapters[ci];
    const chapterLevels=Array.from({length:c.last-c.first+1},(_,k)=>c.first+k);
    const completedCount=chapterLevels.filter(i=>state.done.includes(i)).length;
    const goldCount=chapterLevels.filter(i=>state.medals[i]==='gold').length;
    const silverCount=chapterLevels.filter(i=>state.medals[i]==='silver').length;

    view.dataset.chapter=String(ci);
    view.style.setProperty('--chapter-color',chapterColors[ci]);

    view.innerHTML=`
      <div class="chapterHero">
        <div class="chapterHeroIcon">${chapterVisuals[ci].mini}</div>
        <div class="chapterHeroText">
          <h3>${c.title}</h3>
          <p>${mathHTML(chapterVisuals[ci].text)}</p>
          <div class="chapterHeroStats">
            ${completedCount}/${chapterLevels.length} voltooid
            ${goldCount?` · ${goldCount} goud`:''}
            ${silverCount?` · ${silverCount} zilver`:''}
          </div>
        </div>

        <div class="chapterHint">
          <span class="hintFinger" aria-hidden="true">⌁</span>
          <div>
            <b>Eén tik selecteert</b>
            <small>Tik opnieuw om te starten.</small>
          </div>
        </div>

        <button class="chapterLessonButton">
          <span class="lessonButtonIcon" aria-hidden="true">▶</span>
          <span><b>Uitleg</b><small>bekijk opnieuw</small></span>
        </button>
      </div>

      <div class="selectedLevelGrid"></div>`;

    view.querySelector('.chapterLessonButton').addEventListener('click',()=>showLesson(ci,c.first));

    const levelGrid=view.querySelector('.selectedLevelGrid');

    chapterLevels.forEach((i,k)=>{
      const lv=levels[i];
      const done=state.done.includes(i);
      const medal=state.medals[i] || (done ? 'silver' : '');
      const selectedTile=state.selectedLevelTile===i;
      const transfer=i===c.last && chapterLevels.length>1;

      const b=document.createElement('button');
      b.type='button';
      b.dataset.chapter=String(ci);
      b.dataset.level=String(i);
      b.className='selectedLevelButton'+
        (done?' done':'')+
        (selectedTile?' selected':'')+
        (transfer?' transfer':'')+
        (medal?` ${medal}`:'');
      b.style.setProperty('--chapter-color',chapterColors[ci]);

      const medalMarkup=medal==='gold'
        ? '<span class="tileMedal gold">♛</span>'
        : medal==='silver'
          ? '<span class="tileMedal silver">◆</span>'
          : '';

      b.innerHTML=`
        <span class="levelSequence">${k+1}</span>
        ${medalMarkup}
        <div class="subtileVisual">${levelVisuals[i].mini}</div>
        <div class="subtileText">
          <h4>${lv.title}</h4>
          <p>${mathHTML(levelVisuals[i].text)}</p>
        </div>
        ${done && !medal?'<span class="tileDone">✓</span>':''}
        ${selectedTile?'<span class="tileStartHint">Tik opnieuw om te starten</span>':''}
        ${transfer?'<span class="transferLabel">TRANSFER</span>':''}
      `;

      b.setAttribute(
        'aria-label',
        `Missie ${i+1}: ${lv.title}. ${levelVisuals[i].text}. `+
        `${selectedTile?'Geselecteerd. Tik opnieuw om te starten.':'Tik om te selecteren.'}`
      );

      b.addEventListener('click',()=>{
        if(state.selectedLevelTile===i){
          loadLevel(i);
          return;
        }
        state.selectedLevelTile=i;
        renderMenu();
      });

      levelGrid.appendChild(b);
    });

    qs('#homeStats').textContent=
      `${chapters.length} hoofdstukken · ${levels.length} missies · alles beschikbaar`;

    enableChapterDrag();
  }

  function loadLevel(i){
    state.inLesson=false;
    state.selectedLevelTile=null;
    state.levelIndex=i;
    state.selectedChapter=Math.max(0,chapterForLevel(i));
    localStorage.setItem('gf_last_level',String(i));
    localStorage.setItem('gf_selected_chapter',String(state.selectedChapter));

    state.selection=null;
    state.queueIndex=0;
    state.queueAnswers=[];
    state.completedCurrent=false;
    state.runErrors=0;
    state.runWrongItems=[];
    state.reviewMode=state.medals[i]==='silver';
    state.reviewIndices=null;

    const lv=levels[i];

    if(state.reviewMode && lv.type==='scanner'){
      const remembered=Array.isArray(state.wrongItems[i]) ? state.wrongItems[i] : [];
      if(remembered.length){
        state.reviewIndices=[...new Set(remembered)].filter(x=>x>=0 && x<lv.items.length);
      }
    }

    const ci=chapterForLevel(i);
    const isTransfer=ci>=0 && i===chapters[ci].last;
    el.kicker.textContent=
      (isTransfer ? `${lv.phase} · TRANSFER` : lv.phase)+
      (state.reviewMode ? ' · HERSTEL VOOR GOUD' : '');
    el.title.textContent=lv.title;
    el.text.innerHTML=mathHTML(lv.text);
    el.instruction.innerHTML=mathHTML(
      state.reviewMode
        ? `Herstel voor goud. ${lv.instruction}`
        : lv.instruction
    );
    el.feedback.textContent='';
    el.test.style.display='inline-block';
    el.test.disabled=true;
    el.retry.style.display='none';
    el.next.style.display='none';

    showScreen('gameScreen');
    renderContextBar(ci,i,false);
    renderLevel(lv);
  }


  function mathHTML(value){
    let s=String(value ?? '');

    const frac=(num,den)=>
      `<span class="mathFrac"><span>${num}</span><span>${den}</span></span>`;

    // Common symbolic quotients first, then ordinary numeric fractions.
    s=s.replace(/√49\s*\/\s*√4/g, frac('√49','√4'));
    s=s.replace(/√a\s*\/\s*√b/g, frac('√a','√b'));
    s=s.replace(/(\d+)\/(\d+)/g, (_,a,b)=>frac(a,b));

    return s;
  }

  function renderLevel(lv){
    if(lv.type==='point') renderPoint(lv);
    else if(lv.type==='interval') renderInterval(lv);
    else if(lv.type==='rootExact') renderRootExact(lv);
    else if(lv.type==='scanner') renderScanner(lv);
    else if(lv.type==='translate') renderTranslate(lv);
  }

  function axisPositions(min,max,step){
    const arr=[];
    for(let v=min; v<=max+1e-9; v+=step) arr.push(Number(v.toFixed(6)));
    return arr;
  }
  function pct(v,min,max){return ((v-min)/(max-min))*100}

  function renderPoint(lv){
    const ticks=axisPositions(lv.min,lv.max,lv.step);
    el.gameArea.innerHTML=`<div class="stage"><div class="axisWrap">
      <div class="targetReadout"><div class="targetExpr">${mathHTML(lv.expr)}</div><div class="hintSmall">onbekend signaal</div></div>
      <div class="axis" id="axis"></div>
      <div class="numberLineLegend">Tik op een positie op de getallijn. Je keuze wordt pas bij TEST gecontroleerd.</div>
    </div></div>`;
    const axis=qs('#axis');
    ticks.forEach((v,idx)=>{
      const t=document.createElement('div');
      t.className='tick'+(idx===0?' edge-left':'')+(idx===ticks.length-1?' edge-right':'');
      t.style.left=pct(v,lv.min,lv.max)+'%';
      const lab=document.createElement('div');
      lab.className='tickLabel';
      const showLabel = (lv.step>=1) || Math.abs((v*10)%5)<1e-7 || v===lv.min || v===lv.max;
      if(showLabel) lab.textContent=fmt.format(v);
      t.appendChild(lab);
      axis.appendChild(t);
    });
    axis.onclick=e=>{
      const r=axis.getBoundingClientRect();
      const p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
      const v=lv.min+p*(lv.max-lv.min);
      state.selection=v;
      let m=axis.querySelector('.marker');
      if(!m){m=document.createElement('div');m.className='marker';axis.appendChild(m)}
      m.style.left=(p*100)+'%';
      el.feedback.textContent=`Jouw keuze: ongeveer ${fmt.format(v)}`;
      el.test.disabled=false;
    };
  }

  function renderInterval(lv){
    const ticks=axisPositions(lv.min,lv.max,lv.step);
    el.gameArea.innerHTML=`<div class="stage"><div class="axisWrap">
      <div class="targetReadout"><div class="targetExpr">${mathHTML(lv.expr)}</div><div class="hintSmall">kies twee opeenvolgende gehele grenzen</div></div>
      <div class="axis" id="axis"></div>
      <div class="numberLineLegend">Kies één interval tussen twee opeenvolgende streepjes.</div>
    </div></div>`;
    const axis=qs('#axis');
    ticks.forEach((v,idx)=>{
      const t=document.createElement('div');
      t.className='tick'+(idx===0?' edge-left':'')+(idx===ticks.length-1?' edge-right':'');
      t.style.left=pct(v,lv.min,lv.max)+'%';
      const lab=document.createElement('div');
      lab.className='tickLabel';
      lab.textContent=fmt.format(v);
      t.appendChild(lab);
      axis.appendChild(t);
    });
    for(let i=0;i<ticks.length-1;i++){
      const a=ticks[i],b=ticks[i+1];
      const seg=document.createElement('button');
      seg.className='intervalSeg';
      const left=pct(a,lv.min,lv.max);
      const right=pct(b,lv.min,lv.max);
      seg.style.left=`calc(${left}% + 4px)`;
      seg.style.width=`calc(${right-left}% - 8px)`;
      seg.setAttribute('aria-label',`interval ${a} tot ${b}`);
      seg.onclick=()=>{
        axis.querySelectorAll('.intervalSeg').forEach(s=>s.classList.remove('selected'));
        seg.classList.add('selected');
        state.selection=[a,b];
        el.feedback.textContent=`Jouw interval: ${fmt.format(a)} < ${lv.expr} < ${fmt.format(b)}`;
        el.test.disabled=false;
      };
      axis.appendChild(seg);
    }
  }

  function renderRootExact(lv){
    const shapeClass=lv.shape==='cube'?'cube':'square';
    const label=lv.shape==='cube'?'inhoud':'oppervlakte';
    el.gameArea.innerHTML=`<div class="stage"><div class="shapeStage">
      <div class="shapeVisual"><div><div class="${shapeClass}"><div class="shapeArea">${lv.area}</div></div>
      <div class="shapeSide">${label} = ${lv.area}<br>? = positieve ${lv.shape==='cube'?'ribbe':'zijde'}</div></div></div>
      <div class="answerPanel" id="answers"></div>
    </div></div>`;
    const box=qs('#answers');
    lv.options.forEach(opt=>{
      const b=document.createElement('button');b.className='choice';b.innerHTML=mathHTML(opt);
      b.onclick=()=>{
        box.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');state.selection=opt;el.test.disabled=false;
        el.feedback.innerHTML=mathHTML(`Jouw keuze: ${opt}`);
      };
      box.appendChild(b);
    });
  }

  function renderTranslate(lv){
    el.gameArea.innerHTML=`<div class="stage translateCanvas">
      <div class="translatePrompt">${mathHTML(lv.left)}</div>
      <div class="translateEquals">=</div>
      <div class="optionStack" id="opts"></div>
    </div>`;
    const box=qs('#opts');
    lv.options.forEach(opt=>{
      const b=document.createElement('button');
      b.className='choice';
      b.innerHTML=mathHTML(opt);
      b.onclick=()=>{
        box.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));
        b.classList.add('selected');
        state.selection=opt;
        el.test.disabled=false;
        el.feedback.innerHTML=mathHTML(`Jouw keuze: ${opt}`);
      };
      box.appendChild(b);
    });
  }

  function renderScanner(lv){
    const activeIndices = state.reviewIndices && state.reviewIndices.length
      ? state.reviewIndices
      : lv.items.map((_,idx)=>idx);
    const actualIndex=activeIndices[state.queueIndex];
    const item=lv.items[actualIndex];

    el.gameArea.innerHTML=`<div class="stage spatialScanner">
      <div class="scannerQuestion">${mathHTML(item.expr)}</div>

      <div class="scannerWorld">
        <div class="scannerFieldLabel">BUITEN</div>
        <div class="scannerThreshold" aria-hidden="true"></div>
        <div class="scannerGateLabel">
          <div class="gateTitle">${mathHTML(lv.gate)}</div>
          <div class="gateSub">${lv.predicate}</div>
        </div>
        <div class="scannerFieldLabel inside">BINNEN</div>
      </div>

      <div class="decisionCol">
        <button class="reject" id="rejectBtn"><span class="decisionArrow">←</span> stoppen</button>
        <button class="accept" id="acceptBtn">doorlaten <span class="decisionArrow">→</span></button>
      </div>

      <div class="queueProgress">
        ${state.reviewMode?'herstel':'signaal'} ${state.queueIndex+1} / ${activeIndices.length}
      </div>
    </div>`;

    el.test.style.display='none';
    el.retry.style.display='none';
    el.next.style.display='none';
    qs('#acceptBtn').onclick=()=>scannerDecision(true);
    qs('#rejectBtn').onclick=()=>scannerDecision(false);
    el.feedback.textContent=state.reviewMode
      ? 'Alleen eerder moeilijke signalen komen terug.'
      : 'Kies waar het signaal thuishoort.';
  }

  function scannerDecision(allow){
    const lv=levels[state.levelIndex];
    const activeIndices = state.reviewIndices && state.reviewIndices.length
      ? state.reviewIndices
      : lv.items.map((_,idx)=>idx);
    const actualIndex=activeIndices[state.queueIndex];
    const item=lv.items[actualIndex];

    state.queueAnswers.push(allow);

    if(allow===item.ok){
      toast('Correct','ok');
      el.feedback.innerHTML=mathHTML(item.why || 'Dit signaal is correct behandeld.');
      state.queueIndex++;

      if(state.queueIndex>=activeIndices.length){
        completeLevel(
          state.reviewMode
            ? 'De moeilijke signalen zijn opnieuw correct verwerkt.'
            : 'Alle signalen zijn correct verwerkt.'
        );
      }else{
        setTimeout(()=>renderScanner(lv),220);
      }
    }else{
      state.runErrors++;
      if(!state.runWrongItems.includes(actualIndex)) state.runWrongItems.push(actualIndex);

      toast('Niet helemaal','bad');
      const decision=item.ok
        ? 'Dit signaal moest door.'
        : 'Dit signaal moest gestopt worden.';
      el.feedback.innerHTML=mathHTML((item.why ? item.why+' ' : '') + decision);

      el.retry.style.display='inline-block';
      el.retry.onclick=()=>{
        el.retry.style.display='none';
        renderScanner(lv);
      };

      qs('#acceptBtn').disabled=true;
      qs('#rejectBtn').disabled=true;
    }
  }

  function validateCurrent(){
    const lv=levels[state.levelIndex];
    let ok=false, msg='';
    if(lv.type==='point'){
      ok=Math.abs(state.selection-lv.answer)<=lv.tolerance;
      msg=ok ? (lv.explain||`Goed geplaatst: ${lv.expr}.`) :
        `Nog niet. Je koos ongeveer ${fmt.format(state.selection)}. Zoek een betere begrenzing.`;
    }else if(lv.type==='interval'){
      ok=Array.isArray(state.selection) && state.selection[0]===lv.answer[0] && state.selection[1]===lv.answer[1];
      msg=ok ? lv.explain : `Controleer de kwadraten aan beide grenzen.`;
    }else if(lv.type==='rootExact' || lv.type==='translate'){
      ok=state.selection===lv.answer;
      msg=ok ? lv.explain : `Die keuze bewaart de gevraagde waarde niet.`;
    }
    if(ok) completeLevel(msg);
    else failLevel(msg);
  }

  function failLevel(msg){
    state.runErrors++;
    if(!state.runWrongItems.includes(0)) state.runWrongItems.push(0);

    toast('Herstel nodig','bad');
    el.feedback.innerHTML=mathHTML(msg);
    el.test.style.display='none';
    el.retry.style.display='inline-block';

    el.retry.onclick=()=>{
      state.selection=null;
      el.retry.style.display='none';
      el.test.style.display='inline-block';
      el.test.disabled=true;
      el.feedback.textContent='';
      renderLevel(levels[state.levelIndex]);
    };
  }

  function completeLevel(msg){
    const GOLD_ERROR_LIMIT=1;
    const previous=state.medals[state.levelIndex];
    const earned=state.runErrors<=GOLD_ERROR_LIMIT ? 'gold' : 'silver';
    const medal=previous==='gold' ? 'gold' : earned;

    state.medals[state.levelIndex]=medal;

    if(medal==='gold'){
      delete state.wrongItems[state.levelIndex];
    }else{
      state.wrongItems[state.levelIndex]=state.runWrongItems.length
        ? [...new Set(state.runWrongItems)]
        : [0];
    }

    toast(
      medal==='gold' ? 'Goud behaald' : 'Zilver behaald',
      medal==='gold' ? 'ok' : ''
    );

    el.feedback.innerHTML=mathHTML(
      msg+' '+
      (medal==='gold'
        ? `Goud: ${state.runErrors===0?'foutloos':state.runErrors+' fout gecorrigeerd'}.`
        : `Zilver: ${state.runErrors} fouten. Je mag verder; speel dit niveau opnieuw om de moeilijke stap(pen) te herstellen voor goud.`)
    );

    state.completedCurrent=true;
    if(!state.done.includes(state.levelIndex)) state.done.push(state.levelIndex);

    // Everything remains available; this is kept only for backwards compatibility.
    state.unlocked=levels.length;
    state.selectedChapter=Math.max(0,chapterForLevel(state.levelIndex));

    save();
    renderMenu();

    el.test.style.display='none';
    el.retry.style.display='none';
    el.next.style.display='inline-block';
    el.next.textContent=state.levelIndex===levels.length-1 ? 'NAAR HOOFDSTUKKEN' : 'VOLGENDE';
  }

  el.test.onclick=validateCurrent;
  el.next.onclick=()=>{
    if(state.inLesson){
      const returnLevel = state.lessonReturnLevel;
      const target=state.lessonThenLevel;
      state.inLesson=false;
      state.lessonReturnLevel=null;
      if(returnLevel != null){
        loadLevel(returnLevel);
      } else {
        loadLevel(target);
      }
      return;
    }
    if(state.levelIndex===levels.length-1){showScreen('menuScreen');return}
    const currentChapter=chapterForLevel(state.levelIndex);
    const nextIndex=state.levelIndex+1;
    const nextChapter=chapterForLevel(nextIndex);
    if(nextChapter!==currentChapter){
      showLesson(nextChapter,nextIndex);
    } else {
      loadLevel(nextIndex);
    }
  };






  function enableChapterDrag(){
    const scroller=qs('#chapterSelector');
    if(!scroller || scroller.dataset.dragReady==='1') return;
    scroller.dataset.dragReady='1';

    let down=false;
    let dragging=false;
    let startX=0;
    let startScroll=0;
    let pointerId=null;

    scroller.addEventListener('pointerdown',e=>{
      if(e.pointerType==='touch') return; // native touch swipe
      down=true;
      dragging=false;
      startX=e.clientX;
      startScroll=scroller.scrollLeft;
      pointerId=e.pointerId;
      // IMPORTANT: do not capture here. A normal button click must stay a click.
    });

    scroller.addEventListener('pointermove',e=>{
      if(!down || e.pointerType==='touch') return;
      const dx=e.clientX-startX;

      // Only become a drag after an intentional movement.
      if(!dragging && Math.abs(dx)>7){
        dragging=true;
        scroller.classList.add('dragging');
        try{ scroller.setPointerCapture?.(pointerId); }catch{}
      }

      if(dragging){
        e.preventDefault();
        scroller.scrollLeft=startScroll-dx;
      }
    });

    const finish=e=>{
      if(!down) return;
      const wasDragging=dragging;
      down=false;
      dragging=false;
      scroller.classList.remove('dragging');

      if(wasDragging){
        try{ scroller.releasePointerCapture?.(pointerId); }catch{}
        scroller.dataset.suppressClick='1';
        setTimeout(()=>delete scroller.dataset.suppressClick,120);
      }
      pointerId=null;
    };

    scroller.addEventListener('pointerup',finish);
    scroller.addEventListener('pointercancel',finish);

    // Suppress only the synthetic click after a real drag.
    scroller.addEventListener('click',e=>{
      if(scroller.dataset.suppressClick==='1'){
        e.preventDefault();
        e.stopPropagation();
      }
    },true);
  }

  const appHeader=qs('#appHeader');
  const headerCollapseBtn=qs('#headerCollapseBtn');

  function applyHeaderState(){
    appHeader.classList.toggle('collapsed',state.headerCollapsed);
    headerCollapseBtn.setAttribute('aria-expanded',state.headerCollapsed?'false':'true');
    headerCollapseBtn.setAttribute(
      'aria-label',
      state.headerCollapsed ? 'Bovenbalk uitklappen' : 'Bovenbalk inklappen'
    );
  }

  headerCollapseBtn.onclick=()=>{
    state.headerCollapsed=!state.headerCollapsed;
    localStorage.setItem('gf_header_collapsed',state.headerCollapsed?'1':'0');
    applyHeaderState();
  };

  applyHeaderState();

  qs('#helpBtn').onclick=()=>{
    const ci = Math.max(0, chapterForLevel(state.levelIndex));
    const active = screens.find(s=>s.classList.contains('active'));
    if(active && active.id === 'gameScreen' && !state.inLesson){
      showLesson(ci, state.levelIndex, state.levelIndex);
    } else {
      showLesson(ci, chapters[ci].first, null);
    }
  };

  qs('#homeBtn').onclick=()=>showScreen('homeScreen');
  qs('#menuBtn').onclick=()=>{
    state.selectedChapter=Math.max(0,chapterForLevel(state.levelIndex));
    localStorage.setItem('gf_selected_chapter',String(state.selectedChapter));
    renderMenu();
    showScreen('menuScreen');
  };
  qs('#openMenuBtn').onclick=()=>{
    renderMenu();
    showScreen('menuScreen');
  };
  const startBtn=qs('#startBtn');
  const resumeLevel=getResumeIndex();
  if(state.done.length>0 || resumeLevel>0){
    startBtn.textContent=`Ga verder · missie ${resumeLevel+1}`;
    startBtn.onclick=()=>loadLevel(resumeLevel);
  }else{
    startBtn.textContent='Start';
    startBtn.onclick=()=>showLesson(0,0);
  }

  renderMenu();
})();
</script>
</body>
</html>
